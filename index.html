<style>
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin:24px 0 26px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.now{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px 22px 28px;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--gold)}
.now h1{font-size:clamp(22px,3.2vw,30px);margin:6px 0 12px}
.now .title{font-size:clamp(19px,2.6vw,23px);color:var(--ink);margin:8px 0 6px;font-weight:700;line-height:1.25}
.now p{margin:0 0 6px;color:var(--muted);font-size:15px}
.bar{height:10px;background:var(--tint);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--purple);border-radius:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.side{display:grid;gap:10px;align-content:start}
.side .card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 16px}
.side .ico{font-size:20px;background:var(--tint);width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.side .card>div>b{display:block;color:var(--purple)}
.side small{color:var(--muted);font-size:13.5px;line-height:1.45;display:block}
.side button.lnk{font:inherit;font-size:13.5px;font-weight:700;color:var(--purple);background:none;border:0;padding:0;margin-top:4px;cursor:pointer;text-decoration:underline}
.listhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 0 12px}
.listhead h2{font-size:20px}
.listhead span{color:var(--muted);font-size:14px}
.grades{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.grades .lab{font-size:14px;color:var(--muted);margin-inline-end:2px}
.gp{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 13px;cursor:pointer}
.gp[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.bigrades{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bigrades .gp{font-size:18px;padding:10px 18px;border-color:var(--gc);color:var(--gc)}
.bigrades .gp:hover{background:var(--gc);color:#fff}
.lessons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lessons li{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:12px 16px;padding-inline-start:12px}
.lessons li.cur{border-color:var(--purple);box-shadow:0 0 0 3px var(--tint)}
.lessons li.done .dt{background:#fff;border:1.5px solid var(--line-2)}
.lessons b.t{display:block;font-size:16.5px;color:var(--ink);line-height:1.3}
.lessons .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.lessons .st{margin-top:7px}
.lessons li.off{background:var(--tint);border-color:var(--tint);padding:9px 16px;grid-template-columns:auto 1fr;gap:12px;color:var(--purple);font-size:14px}
.lessons li.off b{font-weight:700}
.wk{display:grid;place-items:center;align-content:center;width:62px;min-height:62px;border-radius:12px;background:var(--tint);color:var(--purple);line-height:1.1;text-align:center}
.wk small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.wk b{font-size:20px}
li.later .wk{background:#fff;border:1.5px dashed var(--line)}
.lessons li.ghead{background:transparent;border:0;padding:16px 2px 0;grid-template-columns:auto 1fr auto;gap:10px}
.lessons li.ghead:first-child{padding-top:0}
.gbadge{display:inline-block;color:#fff;font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px}
.lessons li.ghead .n{color:var(--muted);font-size:14px}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
/* ---- lessons table: weeks down the side, grades across ---- */
:root{--gt6:#FCF1E9;--gt7:#EBF1FD;--gt8:#EAF4EE;--gt9:#FBEBEE;--gt10:#E9F3F2;--gt11:#EFEEFD;--gt12:#F7EBEF;}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto;margin:0 0 8px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:920px}
table.grid[data-show]:not([data-show="all"]){min-width:0}
.grid th,.grid td{border-bottom:1px solid var(--line-2);padding:0;vertical-align:top;text-align:start}
.grid tr:last-child>*{border-bottom:0}
.grid thead th{background:var(--gc,var(--purple));color:#fff;font-size:14px;font-weight:700;padding:10px;text-align:center}
.grid thead th:first-child{background:var(--purple);width:122px}
.grid tbody th{width:122px;padding:10px 12px;background:#fff;border-inline-end:1px solid var(--line-2);position:sticky;inset-inline-start:0;z-index:1}
.grid tbody th b{display:block;font-size:15px;color:var(--purple)}
.grid tbody th small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.grid tbody th small.focus{font-weight:700;color:var(--muted-2)}
.grid td+td{border-inline-start:1px solid var(--line-2)}
.grid td.none{color:#B9B4C8;text-align:center;padding:12px 6px}
.grid a.ls{display:block;height:100%;padding:10px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.35}
.grid a.ls b{font-weight:600}
.grid a.ls:hover b{text-decoration:underline}
table.grid[data-show="6"] .g:not(.g6){display:none}table.grid[data-show="7"] .g:not(.g7){display:none}table.grid[data-show="8"] .g:not(.g8){display:none}table.grid[data-show="9"] .g:not(.g9){display:none}table.grid[data-show="10"] .g:not(.g10){display:none}table.grid[data-show="11"] .g:not(.g11){display:none}table.grid[data-show="12"] .g:not(.g12){display:none}
.grid tr.bridge>*{border-bottom:2px solid var(--line)}
.grid tr.bridge a.ls b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.grid td.g6{background-color:var(--gt6)}.grid td.g7{background-color:var(--gt7)}.grid td.g8{background-color:var(--gt8)}.grid td.g9{background-color:var(--gt9)}.grid td.g10{background-color:var(--gt10)}.grid td.g11{background-color:var(--gt11)}.grid td.g12{background-color:var(--gt12)}
/* this week: a thick purple outline round the whole row, a gentle gold glow and a light sweeping across it */
.grid tr.thisweek>*{border-top:4px solid var(--purple);border-bottom:4px solid var(--purple)!important;
  background-color:#FBF3DD;background-image:linear-gradient(100deg,transparent 0 42%,rgba(255,255,255,.75) 50%,transparent 58% 100%);
  background-size:200% 100%;background-repeat:no-repeat;background-attachment:fixed;animation:twGlow 2.6s ease-in-out infinite,twShine 3.8s ease-in-out infinite}
.grid tr.thisweek th{border-inline-start:4px solid var(--purple)}
.grid tr.thisweek td:last-child{border-inline-end:4px solid var(--purple)}
table.grid[data-show]:not([data-show="all"]) tr.thisweek td:last-child{border-inline-end:1px solid var(--line-2)}
table.grid[data-show="6"] tr.thisweek td.g6{border-inline-end:4px solid var(--purple)}table.grid[data-show="7"] tr.thisweek td.g7{border-inline-end:4px solid var(--purple)}table.grid[data-show="8"] tr.thisweek td.g8{border-inline-end:4px solid var(--purple)}table.grid[data-show="9"] tr.thisweek td.g9{border-inline-end:4px solid var(--purple)}table.grid[data-show="10"] tr.thisweek td.g10{border-inline-end:4px solid var(--purple)}table.grid[data-show="11"] tr.thisweek td.g11{border-inline-end:4px solid var(--purple)}table.grid[data-show="12"] tr.thisweek td.g12{border-inline-end:4px solid var(--purple)}
.grid tr.thisweek th b{font-size:17px}
@keyframes twGlow{0%,100%{background-color:#FBF3DD}50%{background-color:#F5DFA3}}
@keyframes twShine{0%{background-position:160% 0}60%,100%{background-position:-60% 0}}
.grid .tw::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--purple);margin-inline-end:5px;vertical-align:1px;animation:twDot 1.3s ease-in-out infinite}
@keyframes twDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.45}}
@media (prefers-reduced-motion:reduce){.grid tr.thisweek>*,.grid .tw::before{animation:none}}
@media print{.grid tr.thisweek>*{animation:none;background-image:none}}
.grid .tw{display:inline-block;white-space:nowrap;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--purple);border-radius:999px;padding:1px 7px}
.grid a.ls.locked,.grid a.ls.app-locked{color:var(--muted);cursor:not-allowed}
.grid a.ls.locked b,.grid a.ls.app-locked b{font-weight:500}
.grid a.ls .opens,.grid a.ls .app-lock{display:block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.grid .star{font-style:normal;color:#8A5A00;font-weight:800;cursor:help}
.tnote{font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:720px){table.grid{min-width:780px}.grid tbody th,.grid thead th:first-child{width:98px}}
@media print{.tablewrap{overflow:visible;border:0}table.grid{min-width:0}.grid a.ls{font-size:11px;padding:6px}}
@media (max-width:560px){.lessons li{grid-template-columns:auto 1fr;gap:8px 12px}.lessons li>.btn{grid-column:2;justify-self:start}.dt,.wk{width:54px;min-height:56px}.dt b{font-size:19px}}
</style>
</head>

    const cur = w === n, later = secs.every(s => { const d = AICAL.lessonDate(s, w); return d && d > fri; });
    rows.push(`<li class="${cur ? 'cur' : later ? 'later' : ''}"><div class="wk"><small>${esc(T('Week'))}</small><b>${w}</b></div><div><b class="t">${l ? en(l.title) : esc(T('Week {n} lesson', { n: w }))}</b><div class="meta">${esc(ds.join(' · '))}${cur ? esc(T(' · this week')) : ''}</div>` +
      (l ? '' : `<div class="st"><span class="chip muted">${esc(T('Lesson page coming'))}</span></div>`) + `</div>${l ? `<a class="btn small" href="${esc(link(l.id))}"${tgt}>${esc(T('Open'))}</a>` : ''}</li>`);
  }
  rows.push(...foundationRows(g));
  $('#list').innerHTML = rows.join('');
}
function teacherCard() {
  if (STUDENT) return '';
  return `<div class="card"><span class="ico" aria-hidden="true">🧑‍🏫</span><div><b>${esc(T('Teachers'))}</b><small>${esc(T('The teaching calendar shows each class\'s lessons, with links to share with students.'))} <a href="${esc(appPage('calendar'))}"${tgt}>${esc(T('Teaching calendar'))}</a></small>` +
    `<button type="button" class="lnk" data-qr>${esc(T('Show a QR code for this page'))}</button></div></div>`;
}
/* ---------- shell ---------- */
function shell() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.title = T('AI Lessons');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  /* "AI Lessons" next to the logo is the home page, so the menu only lists the other pages */
  const items = STUDENT || ROLE === 'student' ? [['My progress', 'dashboard']] : STAFF ? [['Calendar', 'calendar'], ['Dashboard', 'dashboard']] : [['Teaching calendar', 'calendar']];
  $('#nav').innerHTML = items.map(([t, p]) => p ? `<a href="${esc(appPage(p))}"${tgt}>${esc(T(t))}</a>` : `<a href="${esc(appPage('index'))}"${tgt} aria-current="page">${esc(T(t))}</a>`).join('');
  $('#homeLink').href = appPage('index'); if (APP) $('#homeLink').target = '_top'; $('#homeLink').setAttribute('aria-current', 'page');
  $('#me').textContent = APP ? (APP.name || APP.email) + (STUDENT ? ' · ' + secName(STUDENT) : '') : '';
  $('#langBtn').textContent = LANG === 'ar' ? 'English' : 'العربية'; $('#langBtn').lang = LANG === 'ar' ? 'en' : 'ar';
  $('#footNote').textContent = T(APP ? 'Your answers save to your school account as you go. Only you, your teachers and school leaders can see your progress.' : 'Lessons work on any device. Sign in with your school account to save your answers.');
}
function render() {
  shell();
  if (STUDENT) return studentView();
  tableView();
  if (ROLE === 'student') $('#now').insertAdjacentHTML('afterbegin', `<p class="notice">${esc(T('We could not find your class on the AI Literacy lists yet – ask your teacher. Meanwhile, choose your grade.'))}</p>`);
}
/* grade pills (staff and visitors), remembered on this device */
$('#grades').insertAdjacentHTML('beforeend', `<button type="button" class="gp" style="--gc:var(--purple)" data-g="all" aria-pressed="false" data-i18n="All grades">All grades</button>`);
for (let g = 6; g <= 12; g++) $('#grades').insertAdjacentHTML('beforeend', `<button type="button" class="gp" style="--gc:var(--g${g})" data-g="${g}" aria-pressed="false">${g}</button>`);
document.addEventListener('click', e => {
  const b = e.target.closest('.gp, [data-pick]'); if (b) { const v = b.dataset.g || b.dataset.pick; GRADE = v === 'all' ? 'all' : Number(v); try { localStorage.setItem('home-grade', GRADE); } catch (x) {} render(); return; }
  if (e.target.closest('[data-qr]')) $('#qrBtn').click();
});
if (!STUDENT) {
  let saved = null; try { saved = localStorage.getItem('home-grade'); } catch (x) {}
  /* teachers and admins see every lesson unless they picked a grade before; visitors choose a grade */
  GRADE = Number(saved) >= 6 && Number(saved) <= 12 ? Number(saved) : 'all';
}
$('#langBtn').onclick = () => { LANG = LANG === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('aisa-lang', LANG); } catch (e) {} render(); };
/* QR code for this page (the sign-in bridge swaps in the app link) */
$('#qrBtn').onclick = () => {
  const url = location.href.split('#')[0]; $('#qrUrl').textContent = url; $('#ov').classList.add('on');
  const draw = () => { $('#qr').innerHTML = ''; new QRCode($('#qr'), { text: url, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M }); };
  if (window.QRCode) return draw();
  const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload = draw; sc.onerror = () => { $('#qr').textContent = 'QR code could not load. Share the link below instead.'; }; document.head.appendChild(sc);
};
$('#qrClose').onclick = () => $('#ov').classList.remove('on');
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') $('#ov').classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#ov').classList.remove('on'); });
render();
/* signed-in students: fill in their progress when it arrives */
if (STUDENT && window.google && google.script && google.script.run)
  google.script.run.withSuccessHandler(p => { PROG = (p && p.lessons) || {}; render(); }).withFailureHandler(() => {}).getMyProgress();
</script>
</body>
</html>
