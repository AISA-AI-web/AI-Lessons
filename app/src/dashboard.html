<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<title>AI Curriculum Dashboard</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb;--card:#ffffff;--line:#e4e3df;--grid:#ecebe7;
  --text:#0b0b0b;--text-2:#52514e;--text-3:#76746f;
  --series:#2a78d6;
  --s100:#cde2fb;--s200:#9ec5f4;--s300:#6da7ec;--s400:#3987e5;--s500:#256abf;--s600:#184f95;
  --good:#0ca30c;--warning:#fab219;--critical:#d03b3b;--focus:#1C64F2;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;--surface:#1a1a19;--card:#232322;--line:#3a3936;--grid:#2e2d2b;
  --text:#ffffff;--text-2:#c3c2b7;--text-3:#9a988f;--series:#3987e5;}}
:root[data-theme="dark"]{color-scheme:dark;--surface:#1a1a19;--card:#232322;--line:#3a3936;--grid:#2e2d2b;--text:#ffffff;--text-2:#c3c2b7;--text-3:#9a988f;--series:#3987e5}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em}
.who{color:var(--text-2);font-size:14px}
.who a{color:var(--series);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:12px 0 16px}
.filters label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:3px}
select{max-width:100%}
.filters>div{min-width:0;max-width:100%}
select,button{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);color:var(--text)}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--text-2)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;color:var(--text-2);font-size:12.5px;font-weight:600}
.tile b{display:block;font-size:30px;line-height:1.15;letter-spacing:-.02em}
.tile span{color:var(--text-3);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 2px;font-size:16px}
.card p.sub{margin:0 0 10px;color:var(--text-2);font-size:13px}
.hbars{display:grid;gap:6px}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;align-items:center;font-size:13px}
.hb .lab{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{position:relative;height:22px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--grid) calc(25% - 1px) 25%)}
.hb .bar{position:absolute;left:0;top:3px;bottom:3px;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.hb .val{position:absolute;top:1px;font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;padding-left:6px}
.hb .val.in{color:#fff;padding:0 6px 0 0;transform:translateX(-100%)}
.hb .hit{position:absolute;inset:-3px 0;cursor:default}
.axis{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;font-size:11px;color:var(--text-3)}
.axis div:last-child{display:flex;justify-content:space-between}
.empty{color:var(--text-2);font-size:14px;padding:12px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--text-2);font-weight:700;vertical-align:bottom}
th.l{max-width:140px;white-space:normal;line-height:1.25}
td.c{text-align:center;padding:4px}
.cell{display:inline-block;min-width:76px;border-radius:6px;padding:3px 6px;font-weight:600;line-height:1.3}
.cell small{display:block;font-weight:400;font-size:11px;opacity:.9}
.cell.none{color:var(--text-3);font-weight:400;border:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--text-2);margin:10px 0 0}
.legend i{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.status{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:12.5px}
.tip{position:fixed;z-index:9;pointer-events:none;background:var(--text);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;max-width:280px;display:none;line-height:1.35}
#app>section.card,#body>section.card{margin:0 0 16px}
.tier{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.tier.tN{background:var(--grid);color:var(--text-2)}.tier.tW{background:var(--s100);color:#0b0b0b}.tier.tO{background:var(--s200);color:#0b0b0b}.tier.tE{background:var(--s300);color:#0b0b0b}
.tier.tP{background:var(--s500);color:#fff}.tier.tA{background:var(--s600);color:#fff}
select.jsel{font-size:12px;padding:3px 4px;border-radius:999px;font-weight:700;width:146px}
select.jsel.tW{background:var(--s100);color:#0b0b0b}select.jsel.tO{background:var(--s200);color:#0b0b0b}select.jsel.tE{background:var(--s300);color:#0b0b0b}select.jsel.tP{background:var(--s500);color:#fff}select.jsel.tA{background:var(--s600);color:#fff}
.strands{display:grid;gap:12px}
.strand{display:grid;grid-template-columns:minmax(180px,30%) 1fr auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--grid)}
.strand:first-child{border-top:0}
.strand .sh small{display:block;color:var(--text-2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.strand .sbar .track{position:relative;height:12px;background:var(--grid);border-radius:6px;overflow:hidden}
.strand .sbar .bar{position:absolute;inset:0 auto 0 0;background:var(--series);border-radius:0 6px 6px 0}
.strand .sbar span{font-size:12.5px;color:var(--text-2)}
.strand .next{grid-column:1/-1;margin:0;font-size:13.5px;color:var(--text-2)}
@media (max-width:640px){.strand{grid-template-columns:1fr}}
.stack{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:minmax(150px,32%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.srow .lab{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbarwrap{display:flex;height:24px;gap:2px}
.seg{display:grid;place-items:center;font-size:12px;font-weight:700;min-width:3px}
.seg:first-child{border-radius:4px 0 0 4px}.seg:last-child{border-radius:0 4px 4px 0}
.srow-pct{font-size:12.5px;color:var(--text-2);white-space:nowrap}
@media (max-width:640px){.srow{grid-template-columns:1fr}}
.pill.later{background:var(--grid);color:var(--text-3)}
.journey li.later .dot{border-style:dashed}
.hello{display:grid;grid-template-columns:1fr minmax(240px,44%);gap:16px;align-items:center;margin:0 0 16px}
@media (max-width:700px){.hello{grid-template-columns:1fr}}
.hello h2{font-size:24px}
.now{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.now small{color:var(--text-2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.now b{font-size:16px}
.go{justify-self:start;background:var(--series);color:#fff;border-radius:8px;padding:6px 14px;font-weight:700;text-decoration:none;margin-top:4px}
.pill{display:inline-block;justify-self:start;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin-top:2px}
.pill.done{background:rgba(12,163,12,.12);color:#0a6e0a}.pill.doing{background:rgba(250,178,25,.18);color:#7a5200}.pill.todo{background:var(--grid);color:var(--text-2)}
.journey{list-style:none;margin:0;padding:0;display:grid;gap:0}
.journey li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 0;position:relative}
.journey li+li{border-top:1px solid var(--grid)}
.journey .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--text-3);background:var(--card);justify-self:center}
.journey li.done .dot{background:#0ca30c;border-color:#0ca30c}.journey li.doing .dot{border-color:#fab219;background:#fab219}
.journey small{display:block;color:var(--text-2);font-size:12px}
.journey b{display:block}
.journey a,.journey .off{color:var(--series);font-weight:700;text-decoration:none;font-size:14px}
.callouts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px;font-size:14px}
.badges{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.badges li{display:flex;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;align-items:flex-start}
.badges .ico{font-size:30px;line-height:1;flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--grid)}
.badges li.got{border-color:var(--series);background:rgba(42,120,214,.06)}
.badges li.got .ico{background:#fff3c4;box-shadow:0 0 0 2px #e8b400}
.badges li.locked .ico{filter:grayscale(1);opacity:.45}
.badges b{display:block;font-size:14.5px}
.badges span{display:block;font-size:12.5px;color:var(--text-2);line-height:1.35}
.badges em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--text-3);margin-top:3px}
.badges li.got em{color:#0a6e0a}
.badges.plain .ico{font-size:18px;width:28px;height:28px;font-weight:700;color:var(--text-3)}
.badges.plain li.got .ico{background:#0ca30c;box-shadow:none;color:#fff;filter:none}
.bcount{font-size:16px;letter-spacing:1px;white-space:nowrap}
.note{color:var(--text-3);font-size:12.5px;margin:12px 0 30px}
.stu{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--text-3);text-underline-offset:3px}
.stu:hover{text-decoration-color:currentColor}
.viewbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--series);border-radius:12px;padding:10px 14px;margin:14px 0}
.off{opacity:.55;cursor:default}
.loading{padding:60px 0;text-align:center;color:var(--text-2)}
.err{background:#fde7ec;color:#8a1330;border-radius:10px;padding:12px 14px;margin:20px 0}
.rmsg{margin:0 0 12px;font-weight:600}.rmsg.ok{color:#0a6e0a}.rmsg.bad{color:#b3261e}
.dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:#d03b3b;color:#fff;font-size:12px;line-height:18px;text-align:center;margin-left:4px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
details.sec>summary{cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary b{font-size:16px}
details.sec .in{padding:0 16px 14px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.chip.ok{background:rgba(12,163,12,.12);color:#0a6e0a}.chip.warn{background:rgba(250,178,25,.2);color:#7a5200}.chip.no{background:var(--grid);color:var(--text-2)}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}.rtable td,.rtable th{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;white-space:normal}
.rtable select{font-size:13px;padding:4px 6px}.rtable button{font-size:13px;padding:4px 10px}
details.sec .in{overflow-x:auto}
@media (max-width:600px){.rtable th:nth-child(2),.rtable td:nth-child(2){display:none}.rtable select{max-width:120px}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.form label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:3px}
.form input{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;background:var(--card);color:var(--text)}
.req{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border-top:1px solid var(--grid);padding:10px 0}
.req:first-of-type{border-top:0}
.log li{margin:2px 0;font-size:13.5px;color:var(--text-2)}
.langbtn{font-size:13px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--series);color:var(--series);background:var(--card);font-weight:700}
html[dir="rtl"] body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",system-ui,sans-serif}
html[dir="rtl"] th,html[dir="rtl"] td{text-align:right}
html[dir="rtl"] td.c{text-align:center}
html[dir="rtl"] .hb .track,html[dir="rtl"] .axis div:last-child,html[dir="rtl"] .sbarwrap,html[dir="rtl"] .strand .sbar .track{direction:ltr}
html[dir="rtl"] .printhead .r{text-align:left}
.printhead{display:none}
.tools{display:flex;justify-content:flex-end;gap:8px;margin:12px 0 0}
.viewbar div{display:flex;gap:8px;flex-wrap:wrap}
@page{size:A4 landscape;margin:10mm}
@media print{
  html:root{color-scheme:light;--surface:#fff;--card:#fff;--line:#d9d8d3;--grid:#ecebe7;--text:#0b0b0b;--text-2:#52514e;--text-3:#76746f;--series:#2a78d6}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  header,.filters,.tools,.viewbar,.tip,button:not(.stu),.go,.journey a,.journey .off{display:none!important}
  .stu{text-decoration:none}
  .printhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid #21076C;padding:0 0 8px;margin:0 0 12px}
  .printhead h1{font-size:20px;color:#21076C}
  .printhead p{margin:2px 0 0;font-size:12px;color:#52514e}
  .printhead .r{text-align:right}
  .grid2 .card,.tile,.hello,.strand,.hb,.srow,.badges li,.journey li,tr,.legend{break-inside:avoid}
  .card h2{break-after:avoid}
  .grid2{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tablewrap{overflow:visible;border:0}
  th{position:static}
  th,td{padding:4px 6px}
  select.jsel{-webkit-appearance:none;appearance:none;width:auto;border:0;padding:2px 8px;background-image:none}
  .note{margin-bottom:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title">AI Curriculum Dashboard</h1><div class="who" id="who"></div></div>
  </header>
  <div id="app"><div class="loading">Loading progress…</div></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script src="school-calendar.js"></script>
<script>
var CFG = <?!= cfg ?>;
var D = null, F = { section: '', lesson: '' };
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); };
var pct = function(a, b){ return b ? Math.round(a / b * 100) : 0; };
var mins = function(s){ return Math.round(s / 60); };
var home = CFG.base + '?p=index';

/* ===================== language: English / العربية ===================== */
/* The interface can switch to Arabic (right-to-left). Lesson content, lesson titles and the
   official framework descriptors stay in English. Shared with the calendar via the same key. */
var LKEY = 'u:' + CFG.email + '|aisa-lang';   // same key the lesson pages' sign-in bridge uses
var LANG = (function(){ try { return localStorage.getItem(LKEY) === 'ar' ? 'ar' : 'en'; } catch (e) { return 'en'; } })();
var LOC = 'en-GB';
function setLang(l){
  LANG = l; LOC = l === 'ar' ? 'ar-AE-u-nu-latn' : 'en-GB';
  TIERS = l === 'ar' ? TIERS_AR : TIERS_EN; TIER_SHORT = l === 'ar' ? TIER_SHORT_AR : TIER_SHORT_EN;
  try { localStorage.setItem(LKEY, l); } catch (e) {}
}
function T(s, v){
  var out = LANG === 'ar' && AR[s] !== undefined ? AR[s] : s;
  if (v) out = out.replace(/\{(\w+)\}/g, function(m, k){ return v[k] !== undefined ? v[k] : m; });
  if (LANG !== 'ar') out = out.replace(/\b1 (activit)ies\b/g, '1 $1y').replace(/\b1 students\b/g, '1 student');
  return out;
}
function nStudents(n){ return LANG === 'ar' ? 'عدد الطلاب: ' + n : n + ' student' + (n === 1 ? '' : 's'); }
function secName(s){ return LANG === 'ar' ? String(s || '').replace(/^Boys\b/, 'بنين').replace(/^Girls\b/, 'بنات').replace(/^Unassigned$/, 'غير موزّع') : s; }
function calLabel(s){ return AICAL.label(s, LANG); }
/* Messages from the server are in English; these are the ones teachers can meet. */
var AR_ERRORS = [
  [/^You can only move students out of your own classes\.$/, 'يمكنك نقل الطلاب من شعبك فقط.'],
  [/^You can only add students to your own classes\.$/, 'يمكنك إضافة طلاب إلى شعبك فقط.'],
  [/^You can only confirm your own classes\.$/, 'يمكنك تأكيد قوائم شعبك فقط.'],
  [/^That student is not on the class lists\.$/, 'هذا الطالب غير موجود في قوائم الشعب.'],
  [/^(?:The|That) student is already in (.+)\.$/, function(m){ return 'الطالب موجود بالفعل في ' + secName(m[1]) + '.'; }],
  [/^There is already a request for this student to join (.+)\.$/, function(m){ return 'يوجد طلب سابق لانضمام هذا الطالب إلى ' + secName(m[1]) + '.'; }],
  [/^Type the student's name\.$/, 'اكتب اسم الطالب.'],
  [/^Use the student's @.+ email address\.$/, 'استخدم البريد الإلكتروني المدرسي للطالب (@aisa.sch.ae).'],
  [/^Unknown class/, 'شعبة غير معروفة.'],
  [/^Request not found\.$/, 'لم يتم العثور على الطلب.'],
  [/^This request has already been decided\.$/, 'تم البتّ في هذا الطلب مسبقًا.'],
  [/^Only (.+)'s teacher, an owner or SLT can decide this request\.$/, function(m){ return 'يبتّ في هذا الطلب معلم شعبة ' + secName(m[1]) + ' أو مسؤول النظام أو فريق القيادة فقط.'; }],
  [/^You can only record judgements for students you teach\.$/, 'يمكنك تسجيل المستويات للطلاب الذين تدرّسهم فقط.'],
  [/^Only @.+ accounts can use this site\.$/, 'هذا الموقع متاح لحسابات المدرسة (@aisa.sch.ae) فقط.']
];
function errT(t){
  if (LANG !== 'ar') return t;
  for (var i = 0; i < AR_ERRORS.length; i++) { var m = AR_ERRORS[i][0].exec(t); if (m) return typeof AR_ERRORS[i][1] === 'function' ? AR_ERRORS[i][1](m) : AR_ERRORS[i][1]; }
  return AR[t] || t;
}
var AR = {
  'AI Curriculum Dashboard': 'لوحة متابعة منهج الذكاء الاصطناعي',
  'My progress': 'تقدّمي',
  'Signed in as': 'تم تسجيل الدخول باسم',
  'All lessons': 'جميع الدروس',
  'Loading progress…': 'جارٍ تحميل البيانات…',
  'Section': 'الشعبة',
  'All sections': 'جميع الشعب',
  'All my sections': 'جميع شعبي',
  'Lesson': 'الدرس',
  'Student view': 'عرض الطالب',
  "See a student's dashboard…": 'اعرض لوحة أحد الطلاب…',
  'Class lists': 'قوائم الشعب',
  'Save as PDF': 'حفظ بصيغة PDF',
  'Raw data for spreadsheets': 'بيانات خام لجداول البيانات',
  'Download data (CSV)': 'تنزيل البيانات (CSV)',
  'Lessons started': 'الدروس التي بدأتها',
  'Students': 'الطلاب',
  'of {n} lessons available': 'من أصل {n} من الدروس المتاحة',
  'whole school': 'المدرسة كلها',
  'in my sections': 'في شعبي',

function header(){
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.title = T('AI Curriculum Dashboard');
  $('#title').textContent = CFG.role === 'student' ? T('My progress') : T('AI Curriculum Dashboard');
  $('#who').innerHTML = T('Signed in as') + ' <b>' + esc(CFG.email) + '</b> · <a href="' + esc(home) + '">' + T('All lessons') + '</a> · ' +
    '<button type="button" id="langBtn" class="langbtn" lang="' + (LANG === 'ar' ? 'en' : 'ar') + '">' + (LANG === 'ar' ? 'English' : 'العربية') + '</button>';
  $('#langBtn').onclick = function(){ setLang(LANG === 'ar' ? 'en' : 'ar'); header(); if (D) render(); };
}
header();
if (!D) $('#app').innerHTML = '<div class="loading">' + T('Loading progress…') + '</div>';

var VIEW = null;   // staff: the student whose view is being previewed
var MANAGE = false; // staff: the class-lists screen

function load(){
  if (window.google && google.script && google.script.run)
    google.script.run.withSuccessHandler(function(d){ D = d; addCatalog(); render(); })
      .withFailureHandler(function(e){ $('#app').innerHTML = '<div class="err">' + esc(e.message || e) + '</div>'; }).getDashboard();
  else if (window.__MOCK) { D = window.__MOCK; addCatalog(); render(); }
}

/* Every lesson on the site, not only those someone has started – so a section
   with no work yet still lists its students and lessons. */
function addCatalog(){
  var have = {}; D.lessons.forEach(function(l){ have[l.id] = 1; });
  (D.catalog || []).forEach(function(c){
    if (!have[c.id]) D.lessons.push({ id: c.id, grade: c.grade, course: c.course, week: c.week, title: c.title, activities: c.activities, maxPoints: 0 });
  });
}

function lessonName(l){ return LANG === 'ar' ? 'ص' + l.grade + ' ' + (l.course === 'main' ? 'رئيسي' : 'تمهيدي') + ' – أسبوع ' + l.week : 'G' + l.grade + ' ' + (l.course === 'main' ? 'Main' : 'Bridging') + ' W' + l.week; }
function lessonTitle(l){ return (l.title || '').replace(/ – Grade.*$/, ''); }

/* one row per student × lesson with derived numbers */
function facts(){
  var L = {}; D.lessons.forEach(function(l){ L[l.id] = l; });
  var S = {}; D.students.forEach(function(s){ S[s.email] = s; });
  var students = D.students.filter(function(s){ return !F.section || s.section === F.section; });
  var keep = {}; students.forEach(function(s){ keep[s.email] = 1; });
  var grades = {}, anyGrade = false; students.forEach(function(s){ if (s.grade) { grades[s.grade] = 1; anyGrade = true; } });
  var lessons = D.lessons.filter(function(l){
    return (!F.lesson || l.id === F.lesson) && (!anyGrade || grades[l.grade]);
  }).sort(function(a, b){ return a.grade - b.grade || a.week - b.week || a.course.localeCompare(b.course); });
  var res = D.results.filter(function(r){ return keep[r.email] && L[r.lessonId]; });
  return { L: L, S: S, students: students, lessons: lessons, res: res };
}

function render(){
  var secs = D.sections.slice().sort(function(a, b){ return a.localeCompare(b, undefined, { numeric: true }); });
  var lessons = D.lessons.slice().sort(function(a, b){ return a.grade - b.grade || a.week - b.week; });
  var self = D.scope === 'self';
  if (self) return studentView();
  if (VIEW) return studentView(VIEW);
  if (MANAGE && D.roster) return manageView();
  var html = '';
  if (!self) html += '<div class="filters">' +
    '<div><label for="fSec">' + T('Section') + '</label><select id="fSec"><option value="">' + (D.scope === 'school' ? T('All sections') : T('All my sections')) + '</option>' +
      secs.map(function(s){ return '<option value="' + esc(s) + '"' + (F.section === s ? ' selected' : '') + '>' + esc(secName(s)) + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="fLes">' + T('Lesson') + '</label><select id="fLes"><option value="">' + T('All lessons') + '</option>' +
      lessons.map(function(l){ return '<option value="' + esc(l.id) + '"' + (F.lesson === l.id ? ' selected' : '') + '>' + esc(lessonName(l) + ' – ' + lessonTitle(l)) + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="fView">' + T('Student view') + '</label><select id="fView"><option value="">' + T('See a student\'s dashboard…') + '</option>' +
      D.students.slice().sort(function(a, b){ return a.section.localeCompare(b.section, undefined, { numeric: true }) || a.name.localeCompare(b.name); })
        .filter(function(s){ return !F.section || s.section === F.section; })
        .map(function(s){ return '<option value="' + esc(s.email) + '">' + esc(s.name + ' · ' + secName(s.section)) + '</option>'; }).join('') + '</select></div>' +
    (D.roster ? '<div><button type="button" id="rosterBtn">👥 ' + T('Class lists') + (D.roster.requests.some(function(r){ return r.canDecide; }) ? ' <span class="dot">' + D.roster.requests.filter(function(r){ return r.canDecide; }).length + '</span>' : '') + '</button></div>' : '') +
    '<div><button type="button" id="pdfBtn">' + T('Save as PDF') + '</button></div>' +
    '<div><button type="button" id="exportBtn" title="' + T('Raw data for spreadsheets') + '">' + T('Download data (CSV)') + '</button></div></div>';
  html += '<div id="body"></div>';
  $('#app').innerHTML = html;
  if (!self) {
    $('#fSec').onchange = function(){ F.section = this.value; render(); };
    $('#fView').onchange = function(){ if (this.value) viewAs(this.value); };
    $('#fLes').onchange = function(){ F.lesson = this.value; draw(); };
    $('#exportBtn').onclick = exportCsv;
    $('#pdfBtn').onclick = savePdf;
    if ($('#rosterBtn')) $('#rosterBtn').onclick = function(){ MANAGE = true; render(); window.scrollTo(0, 0); };
  }
  draw();
}

function draw(){
  var f = facts(), self = D.scope === 'self';
  var byLesson = {};
  f.lessons.forEach(function(l){ byLesson[l.id] = { l: l, started: 0, finished: 0, pts: 0, max: 0, secs: 0 }; });
  f.res.forEach(function(r){
    var b = byLesson[r.lessonId]; if (!b) return;
    b.started++; if (r.done >= b.l.activities) b.finished++;
    b.pts += r.score; b.max += Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0); b.secs += r.seconds;
  });
  var rows = Object.keys(byLesson).map(function(k){ return byLesson[k]; });
  var tot = rows.reduce(function(a, b){ a.st += b.started; a.p += b.pts; a.m += b.max; a.s += b.secs; a.fin += b.finished; return a; }, { st: 0, p: 0, m: 0, s: 0, fin: 0 });

  var h = '<div class="tiles">' +
    tile(self ? T('Lessons started') : T('Students'), self ? tot.st : f.students.length, self ? T('of {n} lessons available', { n: f.lessons.length }) : (F.section ? secName(F.section) : (D.scope === 'school' ? T('whole school') : T('in my sections')))) +
    tile(T('Lessons finished'), tot.fin, self ? T('every activity checked') : T('student-lessons with every activity checked')) +
    tile(T('Average first-try score'), tot.m ? pct(tot.p, tot.m) + '%' : '–', T('across activities checked')) +
    tile(T('Average time per lesson'), tot.st ? T('{n} min', { n: mins(tot.s / tot.st) }) : '–', T('active time on the page')) + '</div>';

  if (!self) {
    h += '<div class="grid2">' +
      card(T('Average first-try score by lesson'), T('Mean of each student\'s first attempt, as a % of the points they attempted.'),
        hbars(rows.filter(function(b){ return b.max; }).map(function(b){ return { label: lessonName(b.l), value: pct(b.pts, b.max), text: pct(b.pts, b.max) + '%',
          tip: '<b>' + esc(lessonName(b.l)) + '</b><br>' + esc(lessonTitle(b.l)) + '<br>' + T('Average first try: {p}%', { p: pct(b.pts, b.max) }) + '<br>' + nStudents(b.started) }; }), 100, '%')) +
      card(T('Completion by lesson'), T('Share of students who have checked every activity, out of those whose section has been taught the lesson.'),
        hbars(rows.filter(function(b){ return (b.l.course === 'main' && rosterFor(f, b.l) > 0) || b.started; }).map(function(b){ var n = rosterFor(f, b.l); return { label: lessonName(b.l), value: pct(b.finished, n), text: b.finished + ' / ' + n,
          tip: '<b>' + esc(lessonName(b.l)) + '</b><br>' + T('Finished: {n}', { n: b.finished }) + '<br>' + T('Started, not finished: {n}', { n: b.started - b.finished }) + '<br>' + T('Not started: {n}', { n: Math.max(0, n - b.started) }) }; }), 100, '%')) +
      '</div>';
    if (f.students.length) h += attainmentCard(f);
    if (F.lesson) h += activityChart(f);
  }
  h += progressTable(f, self);
  h += '<p class="note">' + T('First-try scores are kept exactly as first checked; retries are for learning and don\'t change them. Time counts only while the lesson page is open, visible and in use (it pauses after 2 minutes without activity).') + ' ' +
       (self ? '' : (D.scope === 'school' ? T('Only the sections you teach are shown – your role can see the whole school.') : T('Only the sections you teach are shown.'))) + ' ' + T('Data refreshed {d}.', { d: new Date(D.generatedAt).toLocaleString(LOC) }) + '</p>';
  var les = F.lesson && D.lessons.filter(function(l){ return l.id === F.lesson; })[0];
  $('#body').innerHTML = printHead(T('AI Literacy progress report'),
    (F.section ? secName(F.section) : (D.scope === 'school' ? T('Whole school') : T('All my sections'))) + ' · ' + (les ? lessonName(les) + ' – ' + lessonTitle(les) : T('All lessons'))) + h;
  wireTips(); wireJudge();
  document.querySelectorAll('#body .stu').forEach(function(b){ b.onclick = function(){ viewAs(b.getAttribute('data-e')); }; });
}

function viewAs(email){
  VIEW = D.students.filter(function(s){ return s.email === email; })[0] || null;
  render(); window.scrollTo(0, 0);
}

/* Students in this lesson's grade whose section has been taught it (Bridging: everyone in the grade). */
function rosterFor(f, l){ return f.students.filter(function(s){ return (!s.grade || s.grade === l.grade) && (l.course !== 'main' || taughtFor(s.section) >= l.week); }).length; }
function tile(k, v, s){ return '<div class="tile"><small>' + esc(k) + '</small><b>' + esc(v) + '</b><span>' + esc(s) + '</span></div>'; }
function card(t, s, body){ return '<section class="card"><h2>' + esc(t) + '</h2><p class="sub">' + esc(s) + '</p>' + body + '</section>'; }

function hbars(items, max, unit){
  if (!items.length) return '<div class="empty">' + T('No results yet.') + '</div>';
  return '<div class="hbars">' + items.map(function(it){
    var w = Math.max(0, Math.min(100, it.value / max * 100));
    return '<div class="hb"><span class="lab" title="' + esc(it.label) + '">' + esc(it.label) + '</span><div class="track">' +
      '<div class="bar" style="width:' + w + '%"></div><span class="val' + (w > 80 ? ' in' : '') + '" style="left:' + w + '%">' + esc(it.text) + '</span>' +
      '<span class="hit" data-tip="' + esc(it.tip) + '"></span></div></div>';
  }).join('') + '</div><div class="axis" aria-hidden="true"><div></div><div><span>0</span><span>25</span><span>50</span><span>75</span><span>100' + unit + '</span></div></div>';
}

function activityChart(f){
  var acts = {};
  f.res.filter(function(r){ return r.lessonId === F.lesson; }).forEach(function(r){
    Object.keys(r.acts).forEach(function(k){ var a = r.acts[k]; var o = acts[k] || (acts[k] = { title: a[2], part: a[3], p: 0, m: 0, n: 0 }); o.p += a[0]; o.m += a[1]; o.n++; });
  });
  var items = Object.keys(acts).map(function(k){ var a = acts[k]; return { label: (a.part ? a.part + ': ' : '') + a.title, value: pct(a.p, a.m), text: pct(a.p, a.m) + '%',
    tip: '<b>' + esc(a.title) + '</b><br>' + esc(a.part) + '<br>' + T('Average first try: {p}%', { p: pct(a.p, a.m) }) + '<br>' + nStudents(a.n) }; })
    .sort(function(a, b){ return a.value - b.value; });
  return card(T('Which activities need reteaching?'), T('Average first-try score for each activity in this lesson, lowest first.'), hbars(items, 100, '%'));
}

function shade(p){
  var steps = [[90,'var(--s600)','#fff'],[75,'var(--s500)','#fff'],[60,'var(--s400)','#fff'],[40,'var(--s300)','#0b0b0b'],[20,'var(--s200)','#0b0b0b'],[0,'var(--s100)','#0b0b0b']];
  for (var i = 0; i < steps.length; i++) if (p >= steps[i][0]) return steps[i];
  return steps[5];
}

function progressTable(f, self){
  if (!f.lessons.length) return '<div class="card"><div class="empty">' + T('No lessons have been started yet.') + '</div></div>';
  var R = {}; f.res.forEach(function(r){ R[r.email + '|' + r.lessonId] = r; });
  var students = f.students.slice().sort(function(a, b){ return a.section.localeCompare(b.section, undefined, { numeric: true }) || a.name.localeCompare(b.name); });
  var h = '<div class="card" style="padding:0;border:0;background:none"><h2 style="margin:0 0 8px">' + (self ? T('My lessons') : T('Student progress')) + '</h2><div class="tablewrap"><table><thead><tr>' +
    (self ? '' : '<th>' + T('Student') + '</th><th>' + T('Section') + '</th><th>' + T('Badges') + '</th>' + STRAND_ORDER.map(function(c){ return '<th class="l" title="' + esc(strandShort(c)) + '">' + c + '<br><span style="font-weight:400">' + esc(strandShort(c)) + '</span></th>'; }).join('')) +
    f.lessons.map(function(l){ return '<th class="l" title="' + esc(lessonTitle(l)) + '">' + esc(lessonName(l)) + '</th>'; }).join('') + '</tr></thead><tbody>';
  students.forEach(function(s){
    var stt = studentStats(s.email, s.grade), bs = stt.earned;
    h += '<tr>' + (self ? '' : '<td><button type="button" class="stu" data-e="' + esc(s.email) + '" title="' + esc(T('See {name}\'s dashboard', { name: s.name })) + '">' + esc(s.name) + '</button></td><td>' + esc(secName(s.section)) + '</td><td class="c"><span class="bcount" data-tip="' +
      esc(bs.length ? '<b>' + s.name + '</b><br>' + bs.map(function(b){ return b.icon + ' ' + b.name; }).join('<br>') : T('{name} has no badges yet', { name: s.name })) + '">' +
      (bs.length ? bs.slice(0, 4).map(function(b){ return b.icon; }).join('') + (bs.length > 4 ? ' +' + (bs.length - 4) : '') : '–') + '</span></td>' +
      STRAND_ORDER.map(function(c){ return judgeCell(s, c, stt.strands[c]); }).join(''));
    f.lessons.forEach(function(l){
      if (s.grade && s.grade !== l.grade) { h += '<td class="c"><span class="cell none">' + T('n/a') + '</span></td>'; return; }
      var r = R[s.email + '|' + l.id];
      if (!r) { var nt = l.course === 'main' && taughtFor(s.section) < l.week;
        h += '<td class="c"><span class="cell none" data-tip="' + esc(l.course === 'bridging' ? T('Bridging lessons have not been scheduled yet') : nt ? T('{section} has not been taught {lesson} yet', { section: secName(s.section), lesson: lessonName(l) }) : T('{name} has not started {lesson}', { name: s.name, lesson: lessonName(l) })) + '">' + (l.course === 'bridging' ? T('To be scheduled') : nt ? T('Not taught yet') : T('Not started')) + '</span></td>'; return; }
      var max = Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0), p = pct(r.score, max), sh = shade(p);
      var fin = r.done >= l.activities;
      h += '<td class="c"><span class="cell" style="background:' + sh[1] + ';color:' + sh[2] + '" data-tip="' +
        esc('<b>' + s.name + ' · ' + lessonName(l) + '</b><br>' + T('First try: {s} / {m} ({p}%)', { s: r.score, m: max, p: p }) + '<br>' + T('Activities checked: {d} of {a}', { d: r.done, a: l.activities }) + '<br>' + T('Active time: {n} min', { n: mins(r.seconds) })) + '">' +
        p + '%<small>' + (fin ? T('✓ done') : r.done + '/' + l.activities) + ' · ' + mins(r.seconds) + T('m') + '</small></span></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div><div class="legend"><span>' + T('First-try score:') + '</span>' +
    [['var(--s100)','0–19%'],['var(--s200)','20–39%'],['var(--s300)','40–59%'],['var(--s400)','60–74%'],['var(--s500)','75–89%'],['var(--s600)','90–100%']].map(function(x){ return '<span><i style="background:' + x[0] + '"></i>' + x[1] + '</span>'; }).join('') +
    '<span>' + T('· “3/9” = activities checked · “12m” = active minutes') + '</span></div></div>';
  return h;
}

/* ---------- Save as PDF: prints the dashboard as shown, with a report header ---------- */
function printHead(title, scope){

function fitTables(){       // shrink wide tables to the page width (A4 landscape ≈ 1040px)
  document.querySelectorAll('.tablewrap table').forEach(function(t){
    t.style.zoom = ''; var w = t.scrollWidth; if (w > 1040) t.style.zoom = (1040 / w).toFixed(3);
  });
}
function unfitTables(){ document.querySelectorAll('.tablewrap table').forEach(function(t){ t.style.zoom = ''; }); }
addEventListener('beforeprint', fitTables);
addEventListener('afterprint', unfitTables);
function savePdf(name){

function wireTips(){
  var tip = $('#tip');
  document.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('mouseenter', function(){ tip.innerHTML = el.getAttribute('data-tip'); tip.style.display = 'block'; });
    el.addEventListener('mousemove', function(e){ tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
    el.addEventListener('mouseleave', function(){ tip.style.display = 'none'; });
  });
}

/* ===================== class lists (teachers, SLT, owners) ===================== */
function call(fn, args, done){
  var fail = function(e){ msg(e && e.message ? e.message : String(e), true); busy(false); };
  busy(true);
  if (window.google && google.script && google.script.run) { var r = google.script.run.withSuccessHandler(function(x){ busy(false); done(x); }).withFailureHandler(fail); r[fn].apply(r, args); }
  else fail(new Error(T('Not connected.')));
}
function busy(on){ document.querySelectorAll('#app button').forEach(function(b){ b.disabled = on; }); }
function msg(t, bad){ var m = $('#rmsg'); if (m) { m.className = 'rmsg ' + (bad ? 'bad' : 'ok'); m.textContent = bad ? errT(t) : t; } }
var LASTMSG = null;
function reloadWith(t){ LASTMSG = t; load(); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString(LOC, { day: 'numeric', month: 'short', year: 'numeric' }); }
function who(e){ return String(e || '').split('@')[0]; }
function confChip(c){
  if (!c) return '<span class="chip no">' + T('Not confirmed yet') + '</span>';
  if (c.changedSince) return '<span class="chip warn">' + T('Changed since {who} confirmed it on {d}', { who: esc(who(c.by)), d: fmtDate(c.at) }) + '</span>';
  return '<span class="chip ok">' + T('✓ Confirmed by {who} · {d}', { who: esc(who(c.by)), d: fmtDate(c.at) }) + '</span>';
}
function manageView(){

  h += '<p id="rmsg" class="rmsg" role="status" aria-live="polite"></p>';

      dec.map(function(r){ return '<div class="req"><div><b>' + esc(r.name || who(r.student)) + '</b> <span class="sub">(' + esc(r.student) + ')</span><br>' +

        '<div><button type="button" data-dec="' + r.id + '" data-ok="1">' + T('✓ Approve') + '</button> <button type="button" data-dec="' + r.id + '" data-ok="0">' + T('Decline') + '</button></div></div>'; }).join('') +
      wait.map(function(r){ return '<div class="req"><div><b>' + esc(r.name || who(r.student)) + '</b> <span class="sub">(' + esc(r.student) + ')</span><br>' + T('Request to move from {from} to <b>{to}</b> · waiting for {from}\'s teacher', { from: esc(secName(r.from)), to: esc(secName(r.to)) }) + '</div></div>'; }).join('') + '</section>';
  }
  h += '<section class="card"><h2>' + T('Add or request a missing student') + '</h2><p class="sub">' + T('New to the lists? They are added straight away. Already in another class? This sends a request to that class\'s teacher.') + '</p>' +
    '<div class="form"><div><label for="adEmail">' + T('School email') + '</label><input id="adEmail" type="email" dir="ltr" placeholder="12345@aisa.sch.ae" autocomplete="off"></div>' +
    '<div><label for="adName">' + T('Full name (new students)') + '</label><input id="adName" autocomplete="off" placeholder="' + T('First and last name') + '"></div>' +
    '<div><label for="adSec">' + T('Class') + '</label><select id="adSec">' + R.mySections.map(function(s){ return '<option value="' + esc(s) + '"' + (F.section === s ? ' selected' : '') + '>' + esc(secName(s)) + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="adNote">' + T('Note (optional)') + '</label><input id="adNote" autocomplete="off" placeholder="' + T('e.g. joined this week') + '"></div>' +
    '<div><button type="button" id="adBtn">' + T('Add student') + '</button></div></div></section>';
  mine.forEach(function(sec){
    var list = D.students.filter(function(x){ return x.section === sec; }).sort(function(a, b){ return a.name.localeCompare(b.name); });
    h += '<details class="sec"' + (many ? '' : ' open') + '><summary><b>' + esc(secName(sec)) + '</b><span class="sub">' + nStudents(list.length) + '</span>' + confChip(R.confirmations[sec]) + '</summary><div class="in">' +
      (list.length ? '<table class="rtable"><thead><tr><th>' + T('Student') + '</th><th>' + T('Email') + '</th><th>' + T('In the wrong class? Move to…') + '</th></tr></thead><tbody>' +
        list.map(function(x){ return '<tr><td>' + esc(x.name) + '</td><td dir="ltr">' + esc(x.email) + '</td><td><select data-to="' + esc(x.email) + '" aria-label="' + esc(T('Move {name} to', { name: x.name })) + '">' +
          '<option value="">' + T('Choose class…') + '</option>' + R.sections.filter(function(s){ return s !== sec; }).map(function(s){ return '<option value="' + esc(s) + '">' + esc(secName(s)) + '</option>'; }).join('') +
          '</select> <button type="button" data-move="' + esc(x.email) + '" data-name="' + esc(x.name) + '" data-from="' + esc(sec) + '">' + T('Move') + '</button></td></tr>'; }).join('') + '</tbody></table>'
        : '<p class="empty">' + T('No students on this list yet.') + '</p>') +

  });
  if (R.recent.length) h += '<section class="card"><h2>' + T('Recent changes') + '</h2>' +
    (R.canExport ? '<p class="sub">' + T('Send these to IT so the school information system is corrected too.') + ' <button type="button" id="itCsv">' + T('Download changes for IT (CSV)') + '</button></p>' : '') +
    '<ul class="log">' + R.recent.slice(0, 30).map(function(c){
    var v = { from: esc(secName(c.from)), to: esc(secName(c.to)), who: esc(who(c.by)) };

  $('#app').innerHTML = h;
  if (LASTMSG) { msg(LASTMSG); LASTMSG = null; }

    var rows = [['Date', 'Change', 'Student email', 'Student name', 'From class', 'To class', 'Changed by']].concat(R.recent.map(function(c){

function exportCsv(){
  var f = facts(), R = {}; f.res.forEach(function(r){ R[r.email + '|' + r.lessonId] = r; });
  var lines = [['Student','Email','Section','Grade','Lesson','Title','First-try points','Points attempted','First-try %','Activities checked','Activities in lesson','Active minutes'].concat(STRAND_ORDER.map(function(c){ return c + ' tier'; }))];
  f.students.forEach(function(s){ f.lessons.forEach(function(l){
    if (s.grade && s.grade !== l.grade) return;
    var r = R[s.email + '|' + l.id];
    var max = r ? Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0) : 0;
    var stt = studentStats(s.email, s.grade);

var STRAND_LOOKUP = {};
Object.keys(STRAND_MAP).forEach(function(l){ STRAND_MAP[l].split(' ').forEach(function(p){ var x = p.split(':'); STRAND_LOOKUP[l + '|' + x[0]] = x[1]; }); });
function strandOf(lessonId, actId, title, part){
  if (STRAND_LOOKUP[lessonId + '|' + actId]) return STRAND_LOOKUP[lessonId + '|' + actId];
  var t = (String(title || '') + ' ' + String(part || '')).toLowerCase();
  if (/charter|safe|privacy|responsible|ethic|bias|fair(ness)?\b|risk/.test(t)) return 'GE';
  if (/criteri|judge|evaluat|verdict|evidence|claim|compare|check|log\b/.test(t)) return 'CE';
  if (/design|build|plan|workflow|prompt|prototype|map\b/.test(t)) return 'SD';
  return 'CU';
}
function isStretch(a){ return /challenge|⭐/i.test(String(a[2]) + ' ' + String(a[3])); }
function autoTier(o){
  if (!o || !o.n) return '';
  var p = pct(o.p, o.m);
  if (p < TIER_RULES.emergingPct) return 'W';
  if (o.n < TIER_RULES.minActs) return 'O';          // scoring well, but too few activities to secure it yet
  if ((o.n >= TIER_RULES.proficientMinActs && p >= TIER_RULES.proficientPct) || (o.sn && pct(o.sp, o.sm) >= TIER_RULES.stretchPct)) return 'P';
  return 'E';
}
var STRAND_BADGES = { CU: ['🔎', 'AI Detective'], SD: ['🛠️', 'Solution Builder'], CE: ['⚖️', 'Fair Judge'], GE: ['🛡️', 'Responsible User'] };

function catalogFor(grade){
  return (D.catalog || []).filter(function(l){ return l.grade === grade; })
    .sort(function(a, b){ return (a.course === 'bridging' ? 0 : 1) - (b.course === 'bridging' ? 0 : 1) || a.week - b.week; });
}
function lessonInfo(id){
  var l = (D.catalog || []).filter(function(x){ return x.id === id; })[0] || D.lessons.filter(function(x){ return x.id === id; })[0];
  return l || { id: id, activities: 0, week: 0, grade: 0, course: '', title: id };
}
/* Bridging is not scheduled yet. A Main course lesson is due once the student's section has
   actually been taught it – holidays and breaks push a section's lessons back (school-calendar.js). */
function sectionOf(email){ var s = D.students.filter(function(x){ return x.email === email; })[0]; return s ? s.section : ''; }
function taughtFor(section){ return AICAL.taughtSoFar(section, new Date()); }
function isDue(l, taught){ return l.course === 'main' && l.week <= taught; }

/** Everything about one student: lessons, strand tiers and badges. */
function studentStats(email, grade){
  var taught = taughtFor(sectionOf(email));
  var res = D.results.filter(function(r){ return r.email === email; });
  var lessons = catalogFor(grade), due = lessons.filter(function(l){ return isDue(l, taught); });
  var strands = {}, fixed = 0, finished = [], acts = 0, pts = 0, max = 0, badges = [];
  var fixerLesson = false, stretch = false, bull = false;
  STRAND_ORDER.forEach(function(c){ strands[c] = { p: 0, m: 0, n: 0, sp: 0, sm: 0, sn: 0 }; });
  res.forEach(function(r){
    var info = lessonInfo(r.lessonId), wrong = 0, mended = 0;
    if (info.activities && r.done >= info.activities) finished.push(info);
    Object.keys(r.acts).forEach(function(k){
      var a = r.acts[k], o = strands[strandOf(r.lessonId, k, a[2], a[3])];
      o.p += a[0]; o.m += a[1]; o.n++;
      if (isStretch(a)) { o.sp += a[0]; o.sm += a[1]; o.sn++; stretch = true; }
      acts++; pts += a[0]; max += a[1];
      if (a[0] < a[1]) { wrong++; if (a[4] === a[1]) { mended++; fixed++; } }
    });
    if (wrong && mended === wrong) fixerLesson = true;
    var lm = Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0);
    if (info.activities && r.done >= info.activities && pct(r.score, lm) >= 90) bull = true;
  });
  STRAND_ORDER.forEach(function(c){
    var o = strands[c], j = (D.judgements || {})[email + '|' + c];
    o.pct = o.m ? pct(o.p, o.m) : null; o.auto = autoTier(o); o.judged = j || null; o.tier = j ? j.tier : o.auto;
  });
  var finDue = due.filter(function(l){ return finished.some(function(f){ return f.id === l.id; }); }).length;
  var weeks = {}; finished.forEach(function(l){ if (l.course === 'main') weeks[l.week] = 1; });
  var run = 0, best = 0; Object.keys(weeks).map(Number).sort(function(a, b){ return a - b; }).forEach(function(w, i, arr){ run = i && arr[i - 1] === w - 1 ? run + 1 : 1; best = Math.max(best, run); });
  function B(icon, name, desc, earned, prog){ badges.push({ icon: icon, name: name, desc: desc, earned: !!earned, prog: prog }); }
  B('🚀', T('First Steps'), T('Finish your first lesson.'), finished.length >= 1, T('{a} of {b} lessons', { a: 0, b: 1 }));
  B('🏁', T('Finisher'), T('Finish every lesson that has been taught to your grade so far.'), due.length && finDue >= due.length, T('{a} of {b} lessons', { a: finDue, b: due.length }));
  B('🔥', T('Week Streak'), T('Finish your lessons in 3 teaching weeks in a row.'), best >= 3, T('{a} of {b} weeks', { a: best, b: 3 }));
  B('🛠️', T('Fixer'), T('In one lesson, go back and correct every answer you got wrong first time.'), fixerLesson, fixed ? T('{n} answers fixed so far', { n: fixed }) : T('Fix your red answers and check again'));
  B('⭐', T('Stretch'), T('Complete a ⭐ challenge activity.'), stretch, T('Try a ⭐ Challenge'));
  B('🎯', T('Bullseye'), T('Score 90% or more on first tries across a whole lesson.'), bull, T('Aim for 90%+ first time'));
  STRAND_ORDER.forEach(function(c){
    var o = strands[c], sb = STRAND_BADGES[c];
    B(sb[0], T(sb[1]), T('Secure Emerging or above in {s} ({name}).', { s: strandShort(c), name: strandName(c, grade) }), TIER_RANK[o.tier] >= 2,
      o.n ? TIERS[o.tier] + ' · ' + T('{p}% across {n} activities', { p: o.pct, n: o.n }) : T('Not started yet'));
  });
  return { res: res, lessons: lessons, due: due, taught: taught, finished: finished, strands: strands, fixed: fixed, acts: acts, firstPct: max ? pct(pts, max) : null,
           badges: badges, earned: badges.filter(function(b){ return b.earned; }) };
}

function thisWeek(){
  var d = new Date(), mon = AICAL.monday(d), fri = new Date(mon); fri.setDate(fri.getDate() + 4);
  var f = function(x){ return x.toLocaleDateString(LOC, { day: 'numeric', month: 'short' }); }, t = AICAL.teachingWeek(d), range = f(mon) + ' – ' + f(fri);
  if (t === 0) return { label: T('Before the AI Literacy timetable starts') };
  if (t === null) return { label: calLabel(AICAL.noSchool(mon) || 'No school') + ' · ' + range };
  return { label: T('Teaching week {n}', { n: t }) + ' · ' + range };
}

        return { label: (l.course === 'main' ? T('Main') : T('Bridging')) + ' ' + T('W{n}', { n: l.week }), value: pct(r.score, m), text: pct(r.score, m) + '%',
          tip: '<b>' + esc(l.title) + '</b><br>' + T('First try: {s} / {m}', { s: r.score, m: m }) + '<br>' + T('Active time: {n} min', { n: mins(r.seconds) }) }; }), 100, '%'));
  h += '<section class="card"><h2>' + T('My learning journey') + '</h2><p class="sub">' + T('Every AI lesson for your grade.') + '</p><ol class="journey">' +
    st.lessons.map(function(l){ var s = status(l);
      return '<li class="' + s.cls + '"><span class="dot" aria-hidden="true"></span><div><small>' + (l.course === 'main' ? T('Main course · Week {n}', { n: l.week }) : T('Bridging · Week {n}', { n: l.week })) + '</small><b>' + esc(l.title) + '</b>' +
        '<span class="pill ' + s.cls + '">' + esc(s.text) + '</span></div>' + go('', l.id, s.btn) + '</li>'; }).join('') + '</ol></section>';
  h += '<section class="card"><h2>' + (older ? T('Milestones') : T('My badges')) + '</h2><p class="sub">' + (older ? T('Milestones reward careful work, fixing mistakes and stretching yourself – not speed.') : T('Badges reward careful work, fixing mistakes and stretching yourself – not speed.')) + '</p>' +
    '<ul class="badges' + (older ? ' plain' : '') + '">' + st.badges.map(function(b){
      return '<li class="' + (b.earned ? 'got' : 'locked') + '"><span class="ico" aria-hidden="true">' + (older ? (b.earned ? '✓' : '○') : b.icon) + '</span><div><b>' + esc(b.name) + '</b>' +
        '<span>' + esc(b.desc) + '</span><em>' + (b.earned ? (older ? T('Reached') : T('Earned!')) : esc(b.prog)) + '</em></div></li>'; }).join('') + '</ul></section>';
  h += '<p class="note">' + T('Only you, your teachers and school leaders can see this page. There are no class rankings. ✎ means your teacher set that level.') + ' ' + T('Updated {d}.', { d: new Date(D.generatedAt).toLocaleString(LOC) }) + '</p>';
  $('#app').innerHTML = h;
  if (preview) $('#backBtn').onclick = function(){ VIEW = null; render(); };
  $('#pdfBtn').onclick = function(){ savePdf(me.name); };
  wireTips();
}

/* ===================== attainment (teacher, SLT) ===================== */
function attainmentCard(f){
  var rows = STRAND_ORDER.map(function(c){
    var counts = { '': 0, W: 0, O: 0, E: 0, P: 0, A: 0 };
    f.students.forEach(function(s){ counts[studentStats(s.email, s.grade).strands[c].tier]++; });
    return { c: c, counts: counts, total: f.students.length };
  });
  var segs = [['', 'var(--grid)', TIERS['']], ['W', 'var(--s100)', TIER_SHORT.W], ['O', 'var(--s200)', TIERS.O], ['E', 'var(--s300)', TIERS.E], ['P', 'var(--s500)', TIERS.P], ['A', 'var(--s600)', TIERS.A]];
  var g = f.students[0] && f.students.every(function(s){ return s.grade === f.students[0].grade; }) ? f.students[0].grade : null;
  return card(T('Attainment by strand'), (g ? T('Each student\'s current tier in each strand (Grade {g}).', { g: g }) : T('Each student\'s current tier in each strand.')) + ' ' + T('Emerging is the Term 1 expected standard; Advanced is recorded by teachers. Use the menus in the table below to record a tier (✎).'),
    '<div class="stack">' + rows.map(function(r){
      return '<div class="srow"><span class="lab"><b>' + r.c + '</b> ' + esc(g ? strandName(r.c, g) : strandShort(r.c)) + '</span><div class="sbarwrap">' +
        segs.map(function(s){ var n = r.counts[s[0]]; if (!n) return '';
          var w = n / r.total * 100;
          return '<span class="seg" style="width:' + w + '%;background:' + s[1] + ';color:' + (s[0] === 'P' || s[0] === 'A' ? '#fff' : '#0b0b0b') + '" data-tip="' + esc('<b>' + r.c + ' · ' + s[2] + '</b><br>' + T('{n} of {t} students ({p}%)', { n: n, t: r.total, p: Math.round(w) })) + '">' + (w >= 8 ? n : '') + '</span>'; }).join('') +
        '</div><span class="srow-pct">' + T('{p}% at Emerging+', { p: pct(r.counts.E + r.counts.P + r.counts.A, r.total) }) + '</span></div>';
    }).join('') + '</div><div class="legend">' + segs.map(function(s){ return '<span><i style="background:' + s[1] + '"></i>' + s[2] + '</span>'; }).join('') + '</div>');
}

function judgeCell(s, c, o){
  var label = TIER_SHORT[o.tier] + (o.judged ? ' ✎' : '');
  var tip = '<b>' + esc(s.name) + ' · ' + c + '</b><br>' + (o.pct === null ? T('No activities yet') : T('First try {p}% on {n} activities', { p: o.pct, n: o.n })) +
    '<br>' + T('Automatic tier: {t}', { t: TIERS[o.auto] }) + (o.judged ? '<br>' + T('Set by {e}', { e: esc(o.judged.by) }) + (o.judged.note ? ': ' + esc(o.judged.note) : '') : '');
  if (!D.canJudge) return '<td class="c"><span class="tier t' + (o.tier || 'N') + '" data-tip="' + esc(tip) + '">' + esc(label) + '</span></td>';
  return '<td class="c" data-tip="' + esc(tip) + '"><select class="jsel t' + (o.tier || 'N') + '" data-j="' + esc(s.email + '|' + c) + '" aria-label="' + esc(s.name + ' ' + c) + '">' +
    '<option value=""' + (o.judged ? '' : ' selected') + '>' + esc(TIER_SHORT[o.auto]) + '</option>' +
    ['W', 'E', 'P', 'A'].map(function(t){ return '<option value="' + t + '"' + (o.judged && o.judged.tier === t ? ' selected' : '') + '>✎ ' + TIER_SHORT[t] + '</option>'; }).join('') + '</select></td>';
}
function wireJudge(){
  document.querySelectorAll('select[data-j]').forEach(function(el){
    el.onchange = function(){
      var k = el.getAttribute('data-j').split('|'), t = el.value;
      el.disabled = true;
      var done = function(){ if (t) D.judgements[k.join('|')] = { tier: t, by: CFG.email, at: new Date().toISOString(), note: '' }; else delete D.judgements[k.join('|')]; draw(); };
      if (window.google && google.script && google.script.run)
        google.script.run.withSuccessHandler(done).withFailureHandler(function(e){ el.disabled = false; alert(errT(e.message || String(e))); }).setJudgement(k[0], k[1], t, '');
      else done();
    };
  });
}

setLang(LANG); header();
load();
