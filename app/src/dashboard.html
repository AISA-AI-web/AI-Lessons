<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<title>AI Curriculum Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
/* Names the student view and class lists still use, mapped onto the AISA look (site.css). */
:root{--surface:#fff;--card:#fff;--grid:#ECEAF2;--text:var(--ink);--text-2:var(--muted);--text-3:#76746f;--series:#413a9a;--warning:var(--warn);--critical:var(--crit)}
button{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);cursor:pointer;font-weight:600}
button:hover{border-color:var(--purple)}
button:disabled{opacity:.55;cursor:default}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.err{background:#fde7ec;color:#8a1330;border-radius:10px;padding:12px 14px;margin:20px 0}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.note{color:var(--muted-2);font-size:12.5px;margin:12px 0 30px}
/* title bar, class tabs, menus */
.titlebar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:22px 0 16px}
.titlebar h1{font-size:clamp(22px,3vw,28px)}
.titlebar .spacer{flex:1}
.titlebar .seg .n{opacity:.75;font-weight:500}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font-size:12px;line-height:18px;text-align:center;margin-inline-start:6px}
details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer}
details.menu summary::-webkit-details-marker{display:none}
details.menu .popm{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;min-width:260px;z-index:6;box-shadow:0 10px 30px rgba(33,7,108,.14)}
details.menu .popm label{font-size:12px;font-weight:700;color:var(--muted)}
details.menu .popm button{text-align:start;border:0;padding:8px 10px;border-radius:8px}
details.menu .popm button:hover{background:var(--tint)}
/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{background:#fff;border:1px solid var(--line-2);border-top:4px solid var(--gold);border-radius:12px;padding:12px 14px;min-width:0}
.tile>small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.tile>b{display:block;font-size:30px;line-height:1.15;color:var(--purple);letter-spacing:-.01em;margin:2px 0}
.tile>b.t{font-size:16px;line-height:1.3;color:var(--ink);margin:4px 0 6px}
.tile span{color:var(--muted);font-size:13px;display:block;line-height:1.45}
.tile span b{color:var(--ink)}
.tile .val{display:flex;align-items:center;gap:12px}
.tile .val b{font-size:30px;line-height:1.15;color:var(--purple)}
.tile a{font-weight:700}
/* chart cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.mini-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.mini-seg button{border:0;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted);background:none}
.mini-seg button[aria-pressed="true"]{background:var(--tint);color:var(--purple)}
.rows{display:grid;gap:12px}
.row{display:grid;grid-template-columns:minmax(110px,32%) 1fr 48px;gap:10px;align-items:center;font-size:13px}
.row .lab b{display:block;color:var(--ink);font-size:13.5px}
.row .lab small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lab .isnow{color:var(--purple);font-weight:700}
.stack{display:flex;height:22px;gap:2px;background:#fff;direction:ltr}
.seg2{display:grid;place-items:center;font-size:12px;font-weight:700;min-width:2px;cursor:default}
.seg2:first-child{border-radius:4px 0 0 4px}.seg2:last-child{border-radius:0 4px 4px 0}.seg2:only-child{border-radius:4px}
.seg2:hover,.seg2:focus-visible{filter:brightness(1.08)}
.s-done{background:var(--good);color:#1A1A1A}.s-doing{background:var(--warn);color:#1A1A1A}.s-todo{background:var(--crit);color:#fff}.s-later{background:var(--none);color:var(--muted)}
.tN{background:var(--t0);color:var(--muted)}.tW{background:var(--t1);color:#1A1A1A}.tO{background:var(--t2);color:#1A1A1A}.tE{background:var(--t3);color:#fff}.tP{background:var(--t4);color:#fff}.tA{background:var(--t5);color:#fff}
.row .num{font-weight:700;color:var(--ink);text-align:end;font-size:14.5px;font-variant-numeric:tabular-nums}
.trendcard{margin:0 0 22px}
.trendwrap{overflow-x:auto;margin:8px 0 0}
svg.trend{display:block;max-width:none;overflow:visible}svg.trend .ew{font-weight:500;fill:var(--muted)}
svg.trend .gl{stroke:var(--grid,#ECEAF2);stroke-width:1}svg.trend .gl.mid{stroke:#d8d4e6;stroke-dasharray:3 3}
svg.trend .ax{font-size:12px;fill:var(--muted)}svg.trend .el{font-size:12.5px;font-weight:700;fill:var(--ink)}
svg.trend .hit{fill:transparent;cursor:crosshair}svg.trend .hit:hover,svg.trend .hit:focus{fill:rgba(33,7,108,.06);outline:none}
.fh{font-size:15px;margin:16px 0 6px;color:var(--purple)}
ul.focus{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.focus li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;padding:8px 12px;border-radius:10px;background:#F7F5FC}
ul.focus li i{font-style:normal;font-weight:800;width:18px;text-align:center;flex:none}
ul.focus li.warn{background:#FFF4E5}ul.focus li.warn i{color:#a85b00}ul.focus li.good{background:#EAF6EA}ul.focus li.good i{color:#0a6b0a}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:5px}
.morelink{font:inherit;font-size:13px;font-weight:700;color:var(--purple);background:none;border:0;padding:0;margin-top:10px;text-decoration:underline}
table.mini{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.mini th,table.mini td{padding:5px 6px;border-bottom:1px solid var(--line-2);text-align:end}
table.mini th:first-child,table.mini td:first-child{text-align:start}
table.mini th{font-size:11.5px;color:var(--muted);font-weight:700}
/* students */
.stuhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}
.stuhead h2{font-size:19px;margin-inline-end:auto}
.stuhead h2 small{color:var(--muted);font-weight:500;font-size:14px}
.stuhead input[type=search]{min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{font-size:13px;border-radius:999px;padding:4px 11px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--tint);border-color:var(--purple);color:var(--purple)}
.chips button i{font-style:normal;font-weight:700;color:var(--purple);margin-inline-start:5px}
.tablewrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:12px;background:#fff}
table.stable{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:13.5px}
table.stable{min-width:1022px} table.stable col.c-name{width:auto} table.stable col.c-les{width:176px} table.stable col.c-sofar{width:180px} table.stable col.c-str{width:124px}   /* the name column takes the leftover, so the strand columns stay equal */
table.stable th,table.stable td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:start;vertical-align:middle}
table.stable th{position:sticky;top:0;background:var(--tint);color:var(--purple);font-size:12px;font-weight:700;line-height:1.25;z-index:2}
table.stable th small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.stable th.str,table.stable td.str{text-align:center;padding-left:6px;padding-right:6px}
table.stable th.grp{text-align:center;border-bottom:0;padding-bottom:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table.stable .name{position:sticky;inset-inline-start:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line-2)}
table.stable th.name{background:var(--tint);z-index:3}
table.stable tr:last-child td{border-bottom:0}
table.stable tbody tr:hover td{background:#FBFAFE}
.stu{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:700;text-align:start;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu:hover{text-decoration-color:currentColor}
td.name small{display:block;color:var(--muted);font-size:12px}
.ls{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:999px;padding:2px 10px 2px 8px;line-height:1.5;font-variant-numeric:tabular-nums}
.ls i{width:10px;height:10px;border-radius:50%;flex:none;box-sizing:border-box}
.ls.done{background:#E9F6E9}.ls.done i{background:var(--good)}
.ls.doing{background:#FFF4D6}.ls.doing i{border:2px solid var(--warn);background:linear-gradient(90deg,var(--warn) 50%,#fff 50%)}
.ls.todo{background:#FBE9E9}.ls.todo i{border:2px solid var(--crit);background:#fff}
.ls.later{background:none;border:1.5px dashed var(--line);color:var(--muted);font-weight:500}
.ls.absent{background:#ECEEF2;color:#3f4652}.ls.absent i{background:#8a93a3;border-radius:2px}
.strip i.absent{background:#b9c0cc}
.abs{display:inline-block;margin-top:5px;font:inherit;font-size:12px;font-weight:700;color:#3f4652;background:#fff;border:1.5px solid #b9c0cc;border-radius:999px;padding:2px 10px;cursor:pointer}
.abs:hover{border-color:#3f4652}.abs.on{color:var(--muted)}.abs:disabled{opacity:.6;cursor:wait}
@media print{.abs{display:none}}
.ls.rushed{background:#FBE0E0;color:#8f1d1d}.ls.rushed i{background:var(--crit)}
td.name small.tch{color:var(--purple);font-weight:600}
td .sm.tchl{color:var(--purple);font-weight:600}
td .sm.rush,td .sm.rnote{white-space:normal;overflow:visible}
.sm.rush{color:#b3261e;font-weight:700}
.sm.rnote{color:#5c3d00}
.rtk{display:inline-block;margin-top:5px;font:inherit;font-size:12.5px;font-weight:700;color:#fff;background:#b3261e;border:0;border-radius:999px;padding:4px 11px;cursor:pointer}
.rtk:hover{background:#8f1d1d}.rtk:disabled{opacity:.6;cursor:wait}
table.stable tr.rushrow td{background:#FDF0F0}
table.stable tr.rushrow td.name{box-shadow:inset 4px 0 0 var(--crit)}
@media print{.rtk{display:none}}
td .sm{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sofar b{color:var(--ink)}
.strip{display:flex;gap:3px;margin:5px 0 3px;direction:ltr;align-items:center}
.strip i{width:11px;height:11px;border-radius:3px;box-sizing:border-box}
.strip i.done{background:var(--good)}
.strip i.doing{border:2px solid var(--warn);background:linear-gradient(90deg,var(--warn) 50%,#fff 50%)}
.strip i.todo{border:2px solid var(--crit);background:#fff}
.strip small{font-size:11px;color:var(--muted)}
.tchip{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:34px;border:0;border-radius:8px;font-size:12px;font-weight:700;line-height:1.1;text-align:center;padding:0 6px}
button.tchip{cursor:pointer}
button.tchip:hover{filter:brightness(1.07)}
.tchip .pen{position:absolute;top:2px;inset-inline-end:4px;font-size:10px;opacity:.9}
/* tier menu */
.tmenu{position:absolute;z-index:35;width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(33,7,108,.18);padding:10px}
.tmenu p{margin:2px 4px 8px;font-size:13px;color:var(--muted)}
.tmenu p b{color:var(--ink);font-size:14px}
.tmenu button{display:flex;align-items:center;gap:8px;width:100%;font-size:14px;text-align:start;border:0;border-radius:8px;padding:7px 8px;font-weight:500}
.tmenu button:hover{background:var(--tint)}
.tmenu button i{width:14px;height:14px;border-radius:4px;flex:none}
.tmenu button[aria-checked="true"]{font-weight:700}
.tmenu button[aria-checked="true"]::after{content:"✓";margin-inline-start:auto;color:var(--purple)}
.tmenu hr{border:0;border-top:1px solid var(--line-2);margin:6px 0}
@media (max-width:720px){
  .tablewrap{border:0;background:none;overflow:visible}
  table.stable,table.stable tbody,table.stable tr,table.stable td{display:block} table.stable thead,table.stable colgroup{display:none}
  table.stable{min-width:0}
  table.stable tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:12px;margin:0 0 8px}
  table.stable td{border:0;padding:0} table.stable td.name{position:static;box-shadow:none}
  table.stable tbody tr:hover td{background:none}
  td.name{grid-column:1/-1} td.les,td.sofar{grid-column:span 2}
  td[data-l]::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:4px;text-align:start}
  .tchip{font-size:11px;padding:0 3px;height:36px}
}
/* reteach chart and the student's own view (unchanged parts, AISA colours) */
.hbars{display:grid;gap:6px}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;align-items:center;font-size:13px}
.hb .lab{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{position:relative;height:22px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--grid) calc(25% - 1px) 25%);direction:ltr}
.hb .bar{position:absolute;left:0;top:3px;bottom:3px;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.hb .val{position:absolute;top:1px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;padding-left:6px}
.hb .val.in{color:#fff;padding:0 6px 0 0;transform:translateX(-100%)}
.hb .hit{position:absolute;inset:-3px 0;cursor:default}
.axis{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;font-size:11px;color:var(--text-3)}
.axis div:last-child{display:flex;justify-content:space-between;direction:ltr}
#app>section.card,#body>section.card,#tbl+section.card{margin:0 0 16px}
.tier{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.tier.tN{background:var(--t0);color:var(--muted)}
.strands{display:grid;gap:12px}
.strand{display:grid;grid-template-columns:minmax(180px,30%) 1fr auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--grid)}
.strand:first-child{border-top:0}
.strand .sh small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.strand .sbar .track{position:relative;height:12px;background:var(--grid);border-radius:6px;overflow:hidden;direction:ltr}
.strand .sbar .bar{position:absolute;inset:0 auto 0 0;background:var(--series);border-radius:0 6px 6px 0}
.strand .sbar span{font-size:12.5px;color:var(--muted)}
.strand .next{grid-column:1/-1;margin:0;font-size:13.5px;color:var(--muted)}
@media (max-width:640px){.strand{grid-template-columns:1fr}}
.pill.later{background:var(--grid);color:var(--text-3)}
.journey li.later .dot{border-style:dashed}
.hello{display:grid;grid-template-columns:1fr minmax(240px,44%);gap:16px;align-items:center;margin:0 0 16px}
@media (max-width:700px){.hello{grid-template-columns:1fr}}
.hello h2{font-size:24px}
.now{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.now small{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.now b{font-size:16px}
.go{justify-self:start;background:var(--purple);color:#fff;border-radius:8px;padding:6px 14px;font-weight:700;text-decoration:none;margin-top:4px}
.pill{display:inline-block;justify-self:start;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin-top:2px}
.pill.done{background:#E3F4E3;color:#0a5d0a}.pill.doing{background:#FFF3C9;color:#7a5200}.pill.todo{background:var(--grid);color:var(--muted)}
.journey{list-style:none;margin:0;padding:0;display:grid;gap:0}
.journey li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 0;position:relative}
.journey li+li{border-top:1px solid var(--grid)}
.journey .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--text-3);background:#fff;justify-self:center}
.journey li.done .dot{background:var(--good);border-color:var(--good)}.journey li.doing .dot{border-color:var(--warn);background:var(--warn)}
.journey small{display:block;color:var(--muted);font-size:12px}
.journey b{display:block}
.journey a,.journey .off{color:var(--purple);font-weight:700;text-decoration:none;font-size:14px}
.badges{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.badges li{display:flex;gap:10px;border:1.5px solid var(--line-2);border-radius:12px;padding:10px 12px;align-items:flex-start}
.badges .ico{font-size:30px;line-height:1;flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--grid)}
.badges li.got{border-color:var(--purple);background:var(--tint)}
.badges li.got .ico{background:#fff3c4;box-shadow:0 0 0 2px var(--gold)}
.badges li.locked .ico{filter:grayscale(1);opacity:.45}
.badges b{display:block;font-size:14.5px}
.badges span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.badges em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--text-3);margin-top:3px}
.badges li.got em{color:#0a5d0a}
.badges.plain .ico{font-size:18px;width:28px;height:28px;font-weight:700;color:var(--text-3)}
.badges.plain li.got .ico{background:var(--good);box-shadow:none;color:#fff;filter:none}
.viewbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--purple);border-radius:12px;padding:10px 14px;margin:14px 0}
.viewbar div{display:flex;gap:8px;flex-wrap:wrap}
.award-banner{display:flex;gap:14px;align-items:center;background:linear-gradient(100deg,#FFF6DA,#FBEFC8);border:2px solid var(--gold,#D8B664);border-radius:14px;padding:14px 18px;margin:0 0 18px}
.award-banner .cup{font-size:34px;line-height:1}.award-banner small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a5200}
.award-banner b{display:block;font-size:18px;color:var(--purple)}.award-banner span{display:block;font-size:14px;color:var(--ink)}
.awbar{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-weight:600}
.noms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
.nom{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.nom.set{border:2px solid var(--gold,#D8B664);background:#FFF9E8}
.nom small{display:block;font-size:12px;font-weight:700;color:var(--muted)}.nom b{display:block;font-size:17px;color:var(--purple);margin:3px 0}.nom span{font-size:13px;color:var(--muted)}
div.awwrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:12px;background:#fff}
table.awt{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;font-variant-numeric:tabular-nums}
table.awt th,table.awt td{padding:7px 6px;border-bottom:1px solid var(--line-2);text-align:center;vertical-align:middle}
table.awt th{font-size:11.5px;color:var(--muted);font-weight:700}
table.awt td.nm,table.awt th:nth-child(2){text-align:start}
table.awt td.nm small{display:block;color:var(--muted);font-size:12px}table.awt td.nm small.why{color:#a85b00}
table.awt .rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--purple);font-size:12.5px}
table.awt tr:first-child .rk{background:var(--gold,#D8B664)}
table.awt td.sc{font-weight:800;color:var(--purple);font-size:14px}
table.awt tr.inel td{color:var(--muted)}
.nbtn{font:inherit;font-size:12.5px;font-weight:700;border:1.5px solid var(--purple);color:var(--purple);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer}
.nbtn:hover{background:var(--purple);color:#fff}
table.awt.nt td{text-align:start}table.awt.nt small{display:block;color:var(--muted);font-size:12px}table.awt.nt small.blk{display:block}
table.awt.nt input{width:17px;height:17px;accent-color:var(--purple)}
.ntsel{display:flex;gap:6px;flex-wrap:wrap}
.mailprev{border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;margin:8px 0 0;font-size:14px;background:#FCFBFE}.mailprev p{margin:6px 0}
details.inelig{margin:12px 0 0}details.inelig summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.how summary{cursor:pointer}details.how p{font-size:14px;color:var(--ink);margin:8px 0 0}
@media (max-width:700px){.noms{grid-template-columns:1fr}}
.off{opacity:.55;cursor:default}
.tools{display:flex;justify-content:flex-end;gap:8px;margin:12px 0 0}
#app>.tools+.printhead+.hello{margin-top:8px}
/* class lists */
.rmsg{margin:0 0 12px;font-weight:600}.rmsg.ok{color:#0a5d0a}.rmsg.bad{color:#b3261e}
.dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font-size:12px;line-height:18px;text-align:center;margin-inline-start:4px}
details.sec{background:#fff;border:1px solid var(--line-2);border-radius:12px;margin:0 0 10px}
details.sec>summary{cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary b{font-size:16px}
details.sec .in{padding:0 16px 14px;overflow-x:auto}
.chip.no{background:var(--grid);color:var(--muted)}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}.rtable td,.rtable th{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:start;white-space:normal}
.allsw{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--purple);background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.allsw input{width:16px;height:16px;margin:0;accent-color:var(--purple)}
.rtable tr.minerow td{background:#F7F5FC}
.rtable select{font-size:13px;padding:4px 6px}.rtable button{font-size:13px;padding:4px 10px}
@media (max-width:600px){.rtable th:nth-child(2),.rtable td:nth-child(2){display:none}.rtable select{max-width:120px}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.form label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.form input{width:100%}
.req{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border-top:1px solid var(--grid);padding:10px 0}
.req:first-of-type{border-top:0}
.log li{margin:2px 0;font-size:13.5px;color:var(--muted)}
/* Save as PDF: a report header with the school logo */
.printhead{display:none}
@page{size:A4 landscape;margin:10mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:12px}
  .wrap{max-width:none;padding:0}
  .titlebar,.stuhead,.chips,.mini-seg,.morelink,.tip,.tmenu,.viewbar,.tools,.go,.journey a,.journey .off,.tile a{display:none!important}
  .stu{text-decoration:none}
  .printhead{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid var(--purple);padding:0 0 8px;margin:0 0 12px}
  .printhead img{height:38px;width:auto}
  .printhead h1{font-size:18px}
  .printhead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .printhead .r{text-align:end}
  .grid2 .card,.tile,.hello,.strand,.hb,.badges li,.journey li,tr,.legend,.row{break-inside:avoid}
  .card h2{break-after:avoid}
  .grid2{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tablewrap{overflow:visible;border:0}
  table.stable th{position:static}
  .note{margin-bottom:0}
}

/* ===================== the page shell: top bar with the school logo ===================== */
function shell(){
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.title = T('AI Curriculum Dashboard');
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = T(el.getAttribute('data-i18n')); });
  /* "AI Lessons" next to the logo is the lessons home page, so the menu only lists the other pages */
  var items = CFG.role === 'student' ? [['My progress', '']] : [['Calendar', 'calendar'], ['Dashboard', '']];
  $('#nav').innerHTML = items.map(function(x){ return '<a href="' + esc(CFG.base + '?p=' + (x[1] || 'dashboard')) + '"' + (x[1] ? '' : ' aria-current="page"') + '>' + esc(T(x[0])) + '</a>'; }).join('');
  $('#homeLink').href = home;
  $('#me').textContent = CFG.name || CFG.email;
  $('#langBtn').textContent = LANG === 'ar' ? 'English' : 'العربية'; $('#langBtn').setAttribute('lang', LANG === 'ar' ? 'en' : 'ar');
  $('#footNote').textContent = CFG.role === 'student' ? T('Only you, your teachers and school leaders can see this page.') : T('Only the classes you can see are shown. Student data stays in the school\'s protected sheet.');
}
$('#langBtn').onclick = function(){ setLang(LANG === 'ar' ? 'en' : 'ar'); shell(); if (D) render(); else $('#app').innerHTML = '<div class="loading">' + T('Loading progress…') + '</div>'; };

/* ===================== staff view: tiles, overview, one table with the same columns all year ===================== */
var UI = { filter: 'all', sort: 'name', q: '', all: false, les: 'chart', str: 'chart', trend: 'chart' }, ROWS = {}, FACTS = null, RES = {};
/* A section can be split between teachers (classes such as 8B1, 8B2): teachers see their own students
   first and can switch to the whole section. Remembered on this device. */
var SHOWALL = (function(){ try { return localStorage.getItem('dash-show-all') === '1'; } catch (e) { return false; } })();
function splitSecs(){ var o = {}; (D.students || []).forEach(function(s){ if (s.mine === false) o[s.section] = 1; }); return Object.keys(o).sort(numSort); }
function shown(s){ return (SHOWALL || s.mine !== false) && (!F.teacher || (s.teachers || []).indexOf(F.teacher) >= 0); }
function teacherNames(){ var o = {}; (D.students || []).forEach(function(s){ (s.teachers || []).forEach(function(t){ o[t] = 1; }); }); return Object.keys(o).sort(); }
function clsOf(s){ return (s.classes || []).join(', '); }
var DAY3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var TKEYS = ['', 'W', 'O', 'E', 'P', 'A'];
var LST = [['done', 's-done', 'Finished'], ['doing', 's-doing', 'In progress'], ['todo', 's-todo', 'Not started'], ['later', 's-later', 'Not taught yet']];
function fd(d){ return LANG === 'ar' ? d.toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'short' }) : DAY3[d.getDay()] + ' ' + d.getDate() + ' ' + MON3[d.getMonth()]; }
function inSchedule(sec){ return AICAL.SCHEDULE.some(function(r){ return r[0] === sec; }); }
function sumMax(r){ return Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0); }
function numSort(a, b){ return String(a).localeCompare(String(b), undefined, { numeric: true }); }
function lessonShort(l){ return l.course === 'main' ? T('Week {n}', { n: l.week }) : T('Bridging · Week {n}', { n: l.week }); }
function multiGrade(){ var g = {}; FACTS.students.forEach(function(s){ if (s.grade) g[s.grade] = 1; }); return Object.keys(g).length > 1; }

/* where one student is in one lesson */
function statusOf(s, l, R, taught){
  var r = R[s.email + '|' + l.id], max = r ? sumMax(r) : 0;
  var d = l.course === 'main' && inSchedule(s.section) ? AICAL.lessonDate(s.section, l.week) : null;
  if (r && l.activities && r.done >= l.activities) { var p = pct(r.score, max);
    return { st: 'done', r: r, pct: p, date: d, rushed: p < RUSH_PCT && activeSecs(r) < RUSH_MIN * 60 }; }
  if (r) return { st: 'doing', r: r, pct: pct(r.score, max), date: d };
  var ab = (D.absences || {})[s.email + '|' + l.id];
  if (ab && l.course === 'main' && l.week <= taught) return { st: 'absent', ab: ab, date: d };
  if (l.course !== 'main') return { st: 'sched' };
  return { st: l.week <= taught ? 'todo' : 'later', date: d };
}
/* everything the staff view needs about one student. "Need a nudge" = the last lesson their class
   was taught before this week is not finished. */
function rowFor(s, R){
  var st = studentStats(s.email, s.grade), lessons = catalogFor(s.grade), by = {}, now = new Date(), mon = AICAL.monday(now), known = inSchedule(s.section);
  lessons.forEach(function(l){ by[l.id] = statusOf(s, l, R, st.taught); });
  var main = lessons.filter(function(l){ return l.course === 'main'; });

    if (!have[c.id]) D.lessons.push({ id: c.id, grade: c.grade, course: c.course, week: c.week, title: c.title, activities: c.activities, maxPoints: 0 });

function facts(){
  var L = {}; D.lessons.forEach(function(l){ L[l.id] = l; });
  var S = {}; D.students.forEach(function(s){ S[s.email] = s; });
  var students = D.students.filter(function(s){ return (!F.section || s.section === F.section) && shown(s); });
  var keep = {}; students.forEach(function(s){ keep[s.email] = 1; });
  var grades = {}, anyGrade = false; students.forEach(function(s){ if (s.grade) { grades[s.grade] = 1; anyGrade = true; } });
  var lessons = D.lessons.filter(function(l){
    return (!F.lesson || l.id === F.lesson) && (!anyGrade || grades[l.grade]);
  }).sort(function(a, b){ return a.grade - b.grade || a.week - b.week || a.course.localeCompare(b.course); });
  var res = D.results.filter(function(r){ return keep[r.email] && L[r.lessonId]; });

/* ===================== strands, tiers and badges (shared by all views) ===================== */
/* Attainment rules – one place to change them (to be approved by the head of data and assessment).
   Emerging: first-try score >= emergingPct on at least minActs activities in the strand.
   (>= emergingPct on fewer activities shows as 'On track – needs more evidence'.)
   Proficient (indicated): Emerging, plus >= proficientPct on at least proficientMinActs activities,
   or >= stretchPct on that strand's ⭐ challenge (stretch) activities.
   Advanced is never inferred from quiz scores – only a teacher can record it. */
var TIER_RULES = { emergingPct: 70, minActs: 3, proficientPct: 85, proficientMinActs: 5, stretchPct: 70 };
var TIERS_EN = { '': 'Not yet evidenced', W: 'Working towards Emerging', O: 'On track – needs more evidence', E: 'Emerging', P: 'Proficient', A: 'Advanced' };
var TIER_SHORT_EN = { '': 'Not yet', W: 'Working towards', O: 'On track', E: 'Emerging', P: 'Proficient', A: 'Advanced' };
var TIERS_AR = { '': 'لم يُثبت بعد', W: 'يعمل نحو مستوى ناشئ', O: 'على المسار – يحتاج إلى أدلة أكثر', E: 'ناشئ', P: 'متمكّن', A: 'متقدّم' };
var TIER_SHORT_AR = { '': 'لم يُثبت بعد', W: 'نحو ناشئ', O: 'على المسار', E: 'ناشئ', P: 'متمكّن', A: 'متقدّم' };
var TIERS = TIERS_EN, TIER_SHORT = TIER_SHORT_EN;   // switched by setLang()
var TIER_RANK = { '': 0, W: 1, O: 1, E: 2, P: 3, A: 4 };
var STRAND_ORDER = ['CU', 'SD', 'CE', 'GE'];
var STRAND_SHORT = { CU: 'How AI works', SD: 'Design & build', CE: 'Judgement', GE: 'Ethics & governance' };
var STRAND_SHORT_AR = { CU: 'كيف يعمل الذكاء الاصطناعي', SD: 'التصميم والبناء', CE: 'التقييم والحكم', GE: 'الأخلاقيات والحوكمة' };

function strandName(code, grade){
  if (LANG === 'ar') return { CU: grade >= 9 ? 'فهم أنظمة الذكاء الاصطناعي' : 'الفهم المفاهيمي للذكاء الاصطناعي', SD: 'تصميم حلول الذكاء الاصطناعي وتطويرها',
    CE: 'التقييم الناقد والتفاعل الواعي', GE: ({ 9: 'الأخلاقيات والاستخدام المسؤول', 10: 'الحوكمة والأخلاقيات', 11: 'الحوكمة والأثر', 12: 'الحوكمة والأخلاقيات والأثر المجتمعي' })[grade] || 'الأخلاقيات والحوكمة' }[code];
  var fw = D.framework && D.framework[grade];
  if (fw) { var s = fw.strands.filter(function(x){ return x.code === code; })[0]; if (s) return s.name; }

  'grade-12/main-w9-l1': 'vocab:CU onecomp:SD ripple:CU xai:CU depth:GE judge:CE impact:GE wscrit:CU wscomp:SD wsexplain:GE wsmeasure:CE wsimpact:GE wsjust:CE explaindec:GE quiz:CU lvocab:SD lsort:SD lregress:CE lorder:CU lchecks:CE ldefend:GE llock:SD lspine:CU lhard:GE lpaper:SD lquiz:CE',
  'grade-12/main-w10-l1': 'vocab:CU frame:SD jsort:CE claim:CU verify:CE four:CU reflect:CU wsjust:SD wspd:GE wsframe:CE wsrubric:CE paper:SD quiz:CE lvocab:CE lff:CE lcalib:CE lloop:SD lcanvas:GE lscore:CE lhigh:GE lws:CE lrecheck:CE lgoal:CE lpaper:CE lquiz:CE',
  'grade-12/main-w1-l1': 'vocab:CU sort:CU parts:CU judge:CE label:CE norms:GE map:SD quiz:CU lvocab:CU levid:CE lcompare:CE lmap:SD lweak:GE lconc:SD lversions:GE lquiz:CU',
  'grade-12/bridging-w1-l1': 'vocab:CU quality:CU trade:CU purpose:CU map:CU diff:CU score:CE name:CU balance:SD compare:CU check:CU'
};
var STRAND_LOOKUP = {};
Object.keys(STRAND_MAP).forEach(function(l){ STRAND_MAP[l].split(' ').forEach(function(p){ var x = p.split(':'); STRAND_LOOKUP[l + '|' + x[0]] = x[1]; }); });
function strandOf(lessonId, actId, title, part){
  if (STRAND_LOOKUP[lessonId + '|' + actId]) return STRAND_LOOKUP[lessonId + '|' + actId];
  var t = (String(title || '') + ' ' + String(part || '')).toLowerCase();
  if (/charter|safe|privacy|responsible|ethic|bias|fair(ness)?\b|risk/.test(t)) return 'GE';
  if (/criteri|judge|evaluat|verdict|evidence|claim|compare|check|log\b/.test(t)) return 'CE';
  if (/design|build|plan|workflow|prompt|prototype|map\b/.test(t)) return 'SD';
  return 'CU';
}
function isStretch(a){ return /challenge|⭐/i.test(String(a[2]) + ' ' + String(a[3])); }
function autoTier(o){
  if (!o || !o.n) return '';
  var p = pct(o.p, o.m);
  if (p < TIER_RULES.emergingPct) return 'W';
  if (o.n < TIER_RULES.minActs) return 'O';          // scoring well, but too few activities to secure it yet
  if ((o.n >= TIER_RULES.proficientMinActs && p >= TIER_RULES.proficientPct) || (o.sn && pct(o.sp, o.sm) >= TIER_RULES.stretchPct)) return 'P';
  return 'E';
}
var STRAND_BADGES = { CU: ['🔎', 'AI Detective'], SD: ['🛠️', 'Solution Builder'], CE: ['⚖️', 'Fair Judge'], GE: ['🛡️', 'Responsible User'] };

function catalogFor(grade){
  return (D.catalog || []).filter(function(l){ return l.grade === grade; })
    .sort(function(a, b){ return (a.course === 'bridging' ? 0 : 1) - (b.course === 'bridging' ? 0 : 1) || a.week - b.week; });
}
function lessonInfo(id){
  var l = (D.catalog || []).filter(function(x){ return x.id === id; })[0] || D.lessons.filter(function(x){ return x.id === id; })[0];
  return l || { id: id, activities: 0, week: 0, grade: 0, course: '', title: id };
}
/* Bridging is not scheduled yet. A Main course lesson is due once the student's section has
   actually been taught it – holidays and breaks push a section's lessons back (school-calendar.js). */
function sectionOf(email){ var s = D.students.filter(function(x){ return x.email === email; })[0]; return s ? s.section : ''; }
function taughtFor(section){ return AICAL.taughtSoFar(section, new Date()); }
function isDue(l, taught){ return l.course === 'main' && l.week <= taught; }

/** Everything about one student: lessons, strand tiers and badges. */
function studentStats(email, grade){
  var taught = taughtFor(sectionOf(email));
  var res = D.results.filter(function(r){ return r.email === email; });
  var lessons = catalogFor(grade), due = lessons.filter(function(l){ return isDue(l, taught); });
  var strands = {}, fixed = 0, finished = [], acts = 0, pts = 0, max = 0, badges = [];
  var fixerLesson = false, stretch = false, bull = false;
  STRAND_ORDER.forEach(function(c){ strands[c] = { p: 0, m: 0, n: 0, sp: 0, sm: 0, sn: 0 }; });
  res.forEach(function(r){
    var info = lessonInfo(r.lessonId), wrong = 0, mended = 0;
    if (info.activities && r.done >= info.activities) finished.push(info);
    Object.keys(r.acts).forEach(function(k){
      var a = r.acts[k], o = strands[strandOf(r.lessonId, k, a[2], a[3])];
      o.p += a[0]; o.m += a[1]; o.n++;
      if (isStretch(a)) { o.sp += a[0]; o.sm += a[1]; o.sn++; stretch = true; }
      acts++; pts += a[0]; max += a[1];
      if (a[0] < a[1]) { wrong++; if (a[4] === a[1]) { mended++; fixed++; } }
    });
    if (wrong && mended === wrong) fixerLesson = true;
    var lm = Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0);
    if (info.activities && r.done >= info.activities && pct(r.score, lm) >= 90) bull = true;
  });
  STRAND_ORDER.forEach(function(c){
    var o = strands[c], j = (D.judgements || {})[email + '|' + c];
    o.pct = o.m ? pct(o.p, o.m) : null; o.auto = autoTier(o); o.judged = j || null; o.tier = j ? j.tier : o.auto;
  });
  var finDue = due.filter(function(l){ return finished.some(function(f){ return f.id === l.id; }); }).length;
  var weeks = {}; finished.forEach(function(l){ if (l.course === 'main') weeks[l.week] = 1; });
  var run = 0, best = 0; Object.keys(weeks).map(Number).sort(function(a, b){ return a - b; }).forEach(function(w, i, arr){ run = i && arr[i - 1] === w - 1 ? run + 1 : 1; best = Math.max(best, run); });
  function B(icon, name, desc, earned, prog){ badges.push({ icon: icon, name: name, desc: desc, earned: !!earned, prog: prog }); }
  B('🚀', T('First Steps'), T('Finish your first lesson.'), finished.length >= 1, T('{a} of {b} lessons', { a: 0, b: 1 }));
  B('🏁', T('Finisher'), T('Finish every lesson that has been taught to your grade so far.'), due.length && finDue >= due.length, T('{a} of {b} lessons', { a: finDue, b: due.length }));
  B('🔥', T('Week Streak'), T('Finish your lessons in 3 teaching weeks in a row.'), best >= 3, T('{a} of {b} weeks', { a: best, b: 3 }));
  B('🛠️', T('Fixer'), T('In one lesson, go back and correct every answer you got wrong first time.'), fixerLesson, fixed ? T('{n} answers fixed so far', { n: fixed }) : T('Fix your red answers and check again'));
  B('⭐', T('Stretch'), T('Complete a ⭐ challenge activity.'), stretch, T('Try a ⭐ Challenge'));
  B('🎯', T('Bullseye'), T('Score 90% or more on first tries across a whole lesson.'), bull, T('Aim for 90%+ first time'));
  STRAND_ORDER.forEach(function(c){
    var o = strands[c], sb = STRAND_BADGES[c];
    B(sb[0], T(sb[1]), T('Secure Emerging or above in {s} ({name}).', { s: strandShort(c), name: strandName(c, grade) }), TIER_RANK[o.tier] >= 2,
      o.n ? TIERS[o.tier] + ' · ' + T('{p}% across {n} activities', { p: o.pct, n: o.n }) : T('Not started yet'));
  });
  return { res: res, lessons: lessons, due: due, taught: taught, finished: finished, strands: strands, fixed: fixed, acts: acts, firstPct: max ? pct(pts, max) : null,
           badges: badges, earned: badges.filter(function(b){ return b.earned; }) };
}

function thisWeek(){
  var d = new Date(), mon = AICAL.monday(d), fri = new Date(mon); fri.setDate(fri.getDate() + 4);
  var f = function(x){ return x.toLocaleDateString(LOC, { day: 'numeric', month: 'short' }); }, t = AICAL.teachingWeek(d), range = f(mon) + ' – ' + f(fri);
  if (t === 0) return { label: T('Before the AI Literacy timetable starts') };
  if (t === null) return { label: calLabel(AICAL.noSchool(mon) || 'No school') + ' · ' + range };
  return { label: T('Teaching week {n}', { n: t }) + ' · ' + range };
}
function tierChip(t, judged){
  return '<span class="tier t' + (t || 'N') + '">' + esc(TIERS[t]) + (judged ? ' ✎' : '') + '</span>';
}

/* ===================== student view ===================== */
function studentView(who){
  var me = who || D.students[0] || { email: CFG.email, name: CFG.name, grade: 0 }, preview = !!who;
  var st = studentStats(me.email, me.grade), wk = thisWeek(), older = me.grade >= 9;
  var sec = me.section && AICAL.SCHEDULE.some(function(r){ return r[0] === me.section; }) ? me.section : '';
  var curN = sec ? AICAL.currentLesson(sec, new Date()) : st.taught;
  var R = {}; st.res.forEach(function(r){ R[r.lessonId] = r; });
  var url = function(id){ return CFG.base + '?p=' + encodeURIComponent(id); };
  var go = function(cls, id, text){ return preview || !text ? '<span class="' + cls + ' off">' + (text || '🔒') + '</span>' : '<a class="' + cls + '" href="' + esc(url(id)) + '">' + text + '</a>'; };
  /* Students only open Main course lessons their class has reached (the server enforces this too). */
  var rel = AICAL.releasedFor(sec || null, new Date());
  var opens = function(n){ var d = sec ? AICAL.opensOn(sec, n) : AICAL.opensOnGrade(me.grade, n);
    return d ? d.toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'short' }) : '–'; };
  var status = function(l){
    var r = R[l.id], m = r ? Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0) : 0;
    if (r && l.activities && r.done >= l.activities) return { cls: 'done', text: T('✓ Finished · {p}% first try', { p: pct(r.score, m) }), btn: T('Review') };
    if (r) return { cls: 'doing', text: T('{d} of {a} activities · {p}%', { d: r.done, a: l.activities, p: pct(r.score, m) }), btn: T('Continue') };
    if (l.course === 'bridging') return { cls: 'later', text: T('Bridging · to be scheduled'), btn: T('Preview') };
    if (l.week > rel) return { cls: 'later', text: T('🔒 Opens {d}', { d: opens(l.week) }), btn: '' };
    if (l.week > st.taught && l.week !== curN) return { cls: 'later', text: T('Not taught yet · Lesson {n}', { n: l.week }), btn: T('Preview') };
    if (l.week > st.taught) return { cls: 'todo', text: T('This week\'s lesson'), btn: T('Start') };
    return { cls: 'todo', text: T('Not started'), btn: T('Start') };
  };
  var now = st.lessons.filter(function(l){ return l.week === curN && l.course === 'main'; })[0];
  var h = preview ? '<div class="viewbar"><span>👁 ' + T('You are seeing <b>{name}</b>\'s dashboard exactly as they see it. Nothing here can be changed.', { name: esc(me.name) }) + '</span><div><button type="button" id="pdfBtn">' + T('Save as PDF') + '</button><button type="button" id="backBtn">' + T('← Back to dashboard') + '</button></div></div>'
    : '<div class="tools"><button type="button" id="pdfBtn">' + T('Save as PDF') + '</button></div>';
  var gs = T('Grade {g}', { g: me.grade || '–' }) + (me.section && me.section !== 'Unassigned' ? ' · ' + secName(me.section) : '');
  h += printHead(T('AI Literacy progress report') + ' – ' + me.name, gs + ' · ' + wk.label);
  h += '<section class="hello card"><div><h2>' + T('Hi {name} 👋', { name: esc(String(me.name).split(' ')[0]) }) + '</h2><p class="sub">' + esc(gs) + ' · ' + esc(wk.label) + '</p></div>' +
    (now ? '<div class="now"><small>' + T('This week\'s lesson') + '</small><b>' + esc(now.title) + '</b><span class="pill ' + status(now).cls + '">' + esc(status(now).text) + '</span>' +
      go('go', now.id, status(now).btn && status(now).btn + (LANG === 'ar' ? ' ←' : ' →')) + '</div>' : '<div class="now"><small>' + T('This week') + '</small><b>' + T('No new lesson on the site yet.') + '</b></div>') + '</section>';
  h += '<div class="tiles">' +
    tile(T('Lessons finished'), st.finished.filter(function(l){ return l.course === 'main'; }).length + ' / ' + st.due.length, T('Main course lessons taught so far')) +
    tile(T('First-try score'), st.firstPct === null ? '–' : st.firstPct + '%', T('across {n} activities', { n: st.acts })) +
    tile(T('Answers fixed'), st.fixed, T('wrong first time, then corrected')) +
    tile(older ? T('Milestones reached') : T('Badges earned'), st.earned.length + ' / ' + st.badges.length, older ? T('see below') : T('collect them all')) + '</div>';
  if (!preview) h += awardBanner();
  h += '<section class="card trendcard" id="mytrend">' + trendCard(st.res, null, true) + '</section>';
  h += '<section class="card"><h2>' + T('My strands') + '</h2><p class="sub">' + T('The four parts of AI literacy for Grade {g}. Emerging is the goal for this term; Proficient is the goal for the year.', { g: esc(me.grade) }) + '</p><div class="strands">' +
    STRAND_ORDER.map(function(c){
      var o = st.strands[c], next = o.tier === 'A' ? '' : (TIER_RANK[o.tier] >= 3 ? 'A' : (TIER_RANK[o.tier] >= 2 ? 'P' : 'E'));
      var nd = descriptor(c, me.grade, next);
      return '<div class="strand"><div class="sh"><small>' + esc(strandShort(c)) + '</small><b>' + esc(strandName(c, me.grade)) + '</b></div>' +
        '<div class="sbar"><div class="track"><div class="bar" style="width:' + (o.pct || 0) + '%"></div></div><span>' + (o.pct === null ? T('No activities yet') : T('{p}% first try · {n} activities', { p: o.pct, n: o.n })) + '</span></div>' +
        tierChip(o.tier, o.judged) + (nd ? '<p class="next"><b>' + T('Next step – {tier}:', { tier: TIERS[next] }) + '</b> <span lang="en" dir="ltr">' + esc(nd) + '</span></p>' : '') + '</div>';
    }).join('') + '</div></section>';
  h += card(T('My first tries, lesson by lesson'), T('Is your first-try score growing?'),
      hbars(st.lessons.filter(function(l){ return R[l.id]; }).map(function(l){ var r = R[l.id], m = Object.keys(r.acts).reduce(function(n, k){ return n + r.acts[k][1]; }, 0);
        return { label: (l.course === 'main' ? T('Main') : T('Bridging')) + ' ' + T('W{n}', { n: l.week }), value: pct(r.score, m), text: pct(r.score, m) + '%',
          tip: '<b>' + esc(l.title) + '</b><br>' + T('First try: {s} / {m}', { s: r.score, m: m }) + '<br>' + T('Active time: {n} min', { n: mins(r.seconds) }) }; }), 100, '%'));
  h += '<section class="card"><h2>' + T('My learning journey') + '</h2><p class="sub">' + T('Every AI lesson for your grade.') + '</p><ol class="journey">' +
    st.lessons.map(function(l){ var s = status(l);
      return '<li class="' + s.cls + '"><span class="dot" aria-hidden="true"></span><div><small>' + (l.course === 'main' ? T('Main course · Week {n}', { n: l.week }) : T('Bridging · Week {n}', { n: l.week })) + '</small><b>' + esc(l.title) + '</b>' +
        '<span class="pill ' + s.cls + '">' + esc(s.text) + '</span></div>' + go('', l.id, s.btn) + '</li>'; }).join('') + '</ol></section>';
  h += '<section class="card"><h2>' + (older ? T('Milestones') : T('My badges')) + '</h2><p class="sub">' + (older ? T('Milestones reward careful work, fixing mistakes and stretching yourself – not speed.') : T('Badges reward careful work, fixing mistakes and stretching yourself – not speed.')) + '</p>' +
    '<ul class="badges' + (older ? ' plain' : '') + '">' + st.badges.map(function(b){
      return '<li class="' + (b.earned ? 'got' : 'locked') + '"><span class="ico" aria-hidden="true">' + (older ? (b.earned ? '✓' : '○') : b.icon) + '</span><div><b>' + esc(b.name) + '</b>' +
        '<span>' + esc(b.desc) + '</span><em>' + (b.earned ? (older ? T('Reached') : T('Earned!')) : esc(b.prog)) + '</em></div></li>'; }).join('') + '</ul></section>';
  h += '<p class="note">' + T('Only you, your teachers and school leaders can see this page. There are no class rankings. ✎ means your teacher set that level.') + ' ' + T('Updated {d}.', { d: new Date(D.generatedAt).toLocaleString(LOC) }) + '</p>';
  $('#app').innerHTML = h;
  if (preview) $('#backBtn').onclick = function(){ VIEW = null; render(); };
  $('#pdfBtn').onclick = function(){ savePdf(me.name); };
  wireTips();
}

setLang(LANG); shell();
$('#app').innerHTML = '<div class="loading">' + T('Loading progress…') + '</div>';
load();
</script>
