<script>
/* Injected at the top of every page served by the signed-in app.
   - keeps each signed-in user's saved answers separate on shared devices
   - fills in the student's name from their school account
   - sends first-try scores and active time to the protected sheet
   - turns site links into app links */
(function(){
  var CFG = <?!= cfg ?>;
  window.APP = CFG;
  var lessonId = /^grade-/.test(CFG.page) ? CFG.page : null;

  /* 1. Per-user browser storage, so the next student on the same device starts clean */
  try {
    var P = 'u:' + CFG.email + '|', SP = Storage.prototype, g = SP.getItem, s = SP.setItem, r = SP.removeItem;
    SP.getItem = function(k){ return g.call(this, P + k); };
    SP.setItem = function(k, v){ return s.call(this, P + k, v); };
    SP.removeItem = function(k){ return r.call(this, P + k); };
  } catch (e) {}

  function run(fn){ var args = [].slice.call(arguments, 1);
    return new Promise(function(ok, no){
      if (!(window.google && google.script && google.script.run)) return no(new Error('offline'));
      var c = google.script.run.withSuccessHandler(ok).withFailureHandler(no); c[fn].apply(c, args);
    });
  }

  /* 2. Scores: the lesson engine calls LessonHooks.state(S, acts) every time it updates */
  var sent = {}, lastSent = {}, ready = false, latest = null, busy = false, status = null;
  /* The top bar follows the language chosen on the dashboard / calendar (stored per user). */
  var AR = { 'Signed in as': 'تم تسجيل الدخول باسم', 'My progress': 'تقدّمي', 'Dashboard': 'لوحة المتابعة', 'Saving…': 'جارٍ الحفظ…',
             '✓ Saved to your school account': '✓ تم الحفظ في حسابك المدرسي', 'Not saved yet – check your connection. It will retry.': 'لم يُحفَظ بعد – تحقّق من الاتصال. ستُعاد المحاولة.',
             '🔒 Opens': '🔒 يُفتح', 'AI Lessons': 'دروس الذكاء الاصطناعي', 'Lessons': 'الدروس', 'Calendar': 'التقويم', 'My lessons': 'دروسي', 'This lesson is not open yet. It opens for your class on': 'هذا الدرس غير متاح بعد. يُفتح لصفّك في' };
  var ar = false; try { ar = localStorage.getItem('aisa-lang') === 'ar'; } catch (e) {}
  function T(s) { return ar && AR[s] ? AR[s] : s; }
  function setStatus(t, bad){ if (status) { status.textContent = t; status.className = 'app-save' + (bad ? ' bad' : ''); } }
  function flushScores(){
    if (!ready || !latest || busy) return;
    var S = latest.S, acts = latest.acts, items = [];
    acts.forEach(function(a){
      if (S.first[a.id] !== undefined && sent[a.id] === undefined)
        items.push({ id: a.id, title: a.title, part: a.section, score: S.first[a.id], max: a.max });
    });
    var fixes = [];
    acts.forEach(function(a){
      var v = S.last && S.last[a.id], was = lastSent[a.id] !== undefined ? lastSent[a.id] : sent[a.id];
      if (v !== undefined && was !== undefined && v !== was) fixes.push({ id: a.id, score: v, max: a.max });
    });
    if (fixes.length) run('recordLatest', lessonId, fixes).then(function(){ fixes.forEach(function(f){ lastSent[f.id] = f.score; }); }, function(){});
    if (!items.length) return;
    busy = true; setStatus(T('Saving…'));
    var meta = { title: document.title, activities: acts.length, maxPoints: acts.reduce(function(n, a){ return n + a.max; }, 0) };
    run('recordScores', lessonId, meta, items).then(function(){
      items.forEach(function(it){ sent[it.id] = it.score; });
      busy = false; setStatus(T('✓ Saved to your school account')); flushScores();
    }, function(){ busy = false; setStatus(T('Not saved yet – check your connection. It will retry.'), true); setTimeout(flushScores, 15000); });
  }
  window.LessonHooks = { state: function(S, acts){ if (lessonId) { latest = { S: S, acts: acts }; flushScores(); } } };
  /* A teacher can set a retake: when the attempt number goes up, this device's saved answers for the
     lesson are cleared (the page's KEY) and the page reloads clean, with a note saying why. */
  var AK = 'retake-attempt|' + lessonId;
  if (lessonId) run('getLessonState', lessonId).then(function(st){
    var n = Number(st.attempt) || 0, seen = 0;
    try { seen = Number(localStorage.getItem(AK)) || 0; } catch (e) {}
    if (n > seen) {
      try { if (typeof KEY !== 'undefined') localStorage.removeItem(KEY); localStorage.setItem(AK, String(n)); sessionStorage.setItem('retake-note', lessonId); } catch (e) {}
      try { history.scrollRestoration = 'manual'; } catch (e) {}
      location.reload(); return;                       // never send the old answers as the new attempt
    }
    sent = st.done || {}; lastSent = st.latest || {}; ready = true; flushScores();
  }, function(){ ready = true; });

  /* 3. Active time: counts only while the page is visible and the student has
        interacted in the last 2 minutes; sent about once a minute */
  if (lessonId) {
    var last = Date.now(), pending = 0, IDLE = 120000;
    ['pointerdown','keydown','scroll','touchstart','input','mousemove'].forEach(function(ev){
      addEventListener(ev, function(){ last = Date.now(); }, { passive: true, capture: true });
    });
    setInterval(function(){ if (document.visibilityState === 'visible' && Date.now() - last < IDLE) pending++; }, 1000);
    var sendTime = function(){ if (pending < 5) return; var s = pending; pending = 0;
      run('recordTime', lessonId, s).catch(function(){ pending += s; }); };
    setInterval(sendTime, 60000);
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') sendTime(); });
    addEventListener('pagehide', sendTime);
  }

  /* 4. Page touches once the page has loaded */
  function appUrl(p){ return CFG.base + '?p=' + encodeURIComponent(p); }
  /* Students: lessons their class has not reached yet are shown locked (the server refuses them too). */
  var LOCK = CFG.locked || {};
  function lockedId(h){
    var m = /[?&]p=([^&#]+)/.exec(h || '') || /^(?:\.\.\/)?(grade-[a-z0-9\-\/]+)\.html/.exec(h || '');
    var id = m ? decodeURIComponent(m[1]) : ''; return LOCK[id] !== undefined ? id : '';
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
    var id = lockedId(a.getAttribute('href')); if (!id) return;
    e.preventDefault(); e.stopPropagation();
    alert(T('This lesson is not open yet. It opens for your class on') + ' ' + LOCK[id] + '.');
  }, true);
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('a[href]').forEach(function(a){
      var h = a.getAttribute('href'); if (/^(https?:|mailto:|#)/.test(h)) return;
      var m = /^(?:\.\.\/)?([a-z0-9\-\/]+)\.html(#.*)?$/.exec(h); if (!m) return;
      a.href = appUrl(m[1]) + (m[2] || ''); a.target = '_top';
      if (LOCK[m[1]] !== undefined) {
        a.classList.add('app-locked'); a.setAttribute('aria-disabled', 'true');
        var t = document.createElement('small'); t.className = 'app-lock'; t.textContent = T('🔒 Opens') + ' ' + LOCK[m[1]]; a.appendChild(t);
      }
    });
    var note = ''; try { note = sessionStorage.getItem('retake-note'); sessionStorage.removeItem('retake-note'); } catch (e) {}
    if (lessonId && note === lessonId) {
      var rb = document.createElement('div'); rb.className = 'app-retake'; rb.setAttribute('role', 'status');
      rb.innerHTML = ar ? '↻ <b>طلب منك معلمك إعادة هذا الدرس.</b> بدأت محاولة جديدة – خذ وقتك واقرأ كل جزء بعناية. محاولتك الجديدة هي التي تُحتسب.'
        : '↻ <b>Your teacher has asked you to redo this lesson.</b> You are starting a fresh attempt – take your time and read each part carefully. Your new attempt is the one that counts.';
      document.body.insertBefore(rb, document.body.firstChild);
      setTimeout(function(){ window.scrollTo(0, 0); }, 0);
    }
    var nm = document.getElementById('nm');
    if (nm) { nm.value = CFG.name; nm.readOnly = true; nm.title = 'Filled in from your school account';
      try { nm.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {} }
    if (document.querySelector('[data-shell]')) {   // home page and calendar have their own top bar with the user's name
      ['qrBtn','qrTop'].forEach(function(id){ var b = document.getElementById(id); if (b) b.onclick = qrOpen; });
      return;
    }
    var bar = document.createElement('header');
    bar.className = 'app-bar';
    /* the same AISA top bar and menu as the home page, calendar and dashboard (site.css .top) */
    var links = CFG.role === 'student' ? [['My progress', 'dashboard']] : [['Calendar', 'calendar'], ['Dashboard', 'dashboard']];
    bar.innerHTML = '<div class="app-wrap"><a class="app-brand" target="_top" aria-label="' + T('AI Lessons') + '">' +
      '<img class="app-lockup" src="__AISA_LOCKUP__" alt="American International School in Abu Dhabi" width="233" height="40">' +
      '<img class="app-mono" src="__AISA_MONOGRAM__" alt="AISA" width="34" height="34"><span class="app-product">' + T('AI Lessons') + '</span></a>' +
      '<nav class="app-nav" aria-label="Main">' + links.map(function(l){ return '<a target="_top" data-p="' + l[1] + '">' + T(l[0]) + '</a>'; }).join('') + '</nav>' +
      '<span class="app-right">' + (lessonId ? '<span class="app-save" aria-live="polite"></span>' : '') + '<span class="app-me" dir="ltr"></span>' +
      '<button class="app-lang" type="button" lang="' + (ar ? 'en' : 'ar') + '">' + (ar ? 'English' : 'العربية') + '</button></span></div>';
    if (ar) { bar.dir = 'rtl'; bar.lang = 'ar'; }
    bar.querySelector('.app-me').textContent = CFG.name || CFG.email; bar.querySelector('.app-me').title = CFG.email;
    bar.querySelector('.app-brand').href = appUrl('index');
    bar.querySelector('.app-lang').onclick = function(){ try { localStorage.setItem('aisa-lang', ar ? 'en' : 'ar'); } catch (e) {} location.reload(); };
    [].forEach.call(bar.querySelectorAll('[data-p]'), function(a){ a.href = appUrl(a.getAttribute('data-p')); });
    var font = document.createElement('link'); font.rel = 'stylesheet';
    font.href = 'https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap'; document.head.appendChild(font);
    document.body.insertBefore(bar, document.body.firstChild);
    status = bar.querySelector('.app-save');
    var qr = qrOpen;
    ['qrBtn','qrTop'].forEach(function(id){ var b = document.getElementById(id); if (b) b.onclick = qr; });
  });
  /* QR code for the app address of this page (lesson pages and the home page) */
  function qrOpen(){ var url = appUrl(CFG.page), ov = document.getElementById('ov'); if (!ov) return;
      document.getElementById('qrUrl').textContent = url; ov.classList.add('on');
      var draw = function(){ var el = document.getElementById('qr'); el.innerHTML = ''; new QRCode(el, { text: url, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M }); };
      if (window.QRCode) return draw();
      var sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = draw; document.head.appendChild(sc); }
})();
</script>
<style>
.app-bar{display:block;background:#21076C;color:#fff;font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;padding:0;position:relative;z-index:50}
.app-wrap{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;min-height:64px}
.app-bar a{color:#fff;text-decoration:none}
.app-brand{display:flex;align-items:center;gap:12px;flex:none}
.app-brand img{display:block;max-width:none}
.app-lockup{height:40px;width:auto}
.app-mono{display:none!important;height:34px;width:34px}
.app-product{font-weight:700;font-size:16px;letter-spacing:.01em;padding-inline-start:12px;border-inline-start:1px solid rgba(255,255,255,.35);white-space:nowrap}
.app-nav{display:flex;gap:2px}
.app-nav a{font-weight:600;font-size:16px;padding:8px 13px;border-radius:999px;opacity:.85;white-space:nowrap}
.app-nav a:hover{opacity:1;background:rgba(255,255,255,.1)}
.app-right{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.app-me{opacity:.92;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-lang{font:inherit;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.65);color:#fff;background:transparent;cursor:pointer}
@media (max-width:1000px){.app-lockup{display:none!important}.app-mono{display:block!important}}
@media (max-width:640px){
  .app-wrap{flex-wrap:wrap;gap:4px 12px;padding-top:10px;padding-bottom:6px;min-height:0}
  .app-nav{order:3;width:100%;margin:0 -16px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
  .app-nav a{padding:7px 11px;font-size:14px}
  .app-me{display:none}
}
.app-save{color:#9be59b}.app-save.bad{color:#ffb3b3}
.app-retake{background:#FFF3C9;color:#5c3d00;border-bottom:2px solid #D8B664;padding:12px 16px;font:15px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
a.app-locked{opacity:.6;cursor:not-allowed}
.app-lock{display:block;font-size:12px;font-weight:600;margin-top:2px}
@media print{.app-bar{display:none}}
</style>
