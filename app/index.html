<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AISA AI Lessons – opening the app…</title>
<link rel="icon" href="../assets/aisa/favicon.png">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#1A1A1A;
       font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .box{max-width:460px;margin:24px 16px;padding:28px 24px;border:1px solid #E6E1F5;border-radius:12px;text-align:center}
  img{height:44px;width:44px}
  h1{color:#21076C;font-size:22px;margin:12px 0 6px}
  a.btn{display:inline-block;margin-top:14px;padding:11px 22px;border-radius:999px;background:#21076C;color:#fff;font-weight:700;text-decoration:none;box-shadow:inset 0 -3px 0 #D8B664}
  p{margin:6px 0;color:#555}
</style>
<script>
  /* Short link: aisa-ai-web.github.io/AI-Lessons/app → the signed-in Apps Script web app.
     The deployment ID stays the same when the app is updated via Manage deployments → Edit → New version.
     Only change APP_URL if a brand-new deployment is ever created. */
  var APP_URL = 'https://script.google.com/a/macros/aisa.sch.ae/s/AKfycbyxIhdUxnImhZOsjjFX3E0kWRcVJN2_XgwUKSkmxt-8qha9COPqqK1bdYORnjt8cbBL4w/exec';
  var READY = APP_URL.indexOf('PASTE_') < 0;
  if (READY) location.replace(APP_URL + location.search + location.hash);
</script>
</head>
<body>
<main class="box">
  <img src="../assets/aisa/monogram-purple.png" alt="AISA">
  <h1>AI Lessons</h1>
  <p id="msg">Opening the app… sign in with your @aisa.sch.ae account.</p>
  <a class="btn" id="go" href="../index.html">Open the AI Lessons app</a>
</main>
<script>
  if (READY) document.getElementById('go').href = APP_URL;
  else document.getElementById('msg').textContent = 'The app link has not been set up yet.';
</script>
</body>
</html>
